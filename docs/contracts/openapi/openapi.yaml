        "200": {description: Counts by template and status., content: {application/json: {schema: {$ref: "#/components/schemas/MailMetricsResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
