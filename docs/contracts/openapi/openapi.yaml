        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404": {$ref: "#/components/responses/NotificationNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/organization:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOOrganization
      summary: Read the authenticated CPO's organization details
      description: |
        Returns a tenant-safe, read-only projection of the CPO registration
        and operational identity managed by the platform. The CPO ID is
        derived from the verified ADMIN session; callers cannot select another
        tenant. Internal platform actor IDs and the privileged lifecycle reason
        are omitted. Organization changes remain Superadmin-only.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current CPO organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOOrganization"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/subscription:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOSubscription
      summary: Get the current CPO subscription
      description: Returns the subscription details for the authenticated CPO.
      security:
        - BearerAuth: []
        - CPOAppID: []
      responses:
        "200":
          description: The CPO's current subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOSubscriptionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: Subscription not found for this CPO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: subscription_not_found
                  message: No subscription found for this CPO.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/analytics:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOAnalytics
      summary: Get CPO analytics
      description: |
        Get CPO analytics data. By default returns overall totals for all time.
        Supply `period` and `date` to filter session aggregates (TotalRevenue,
        TotalUsage, TotalSessions) to a specific time window. The overall counts
        of chargers and connectors remain unfiltered.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, year]
          description: |
            Time period for filtering session data. When omitted, overall
            session data is returned.
          example: day
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: |
            Reference date for the period (ISO 8601 date, YYYY-MM-DD). For
            `period=day` it filters sessions started on that date; for `week`
            it filters the Monday‑to‑Sunday week containing that date; for
            `month` the calendar month; for `year` the calendar year.
          example: "2026-08-25"
      responses:
        "200":
          description: The CPO analytics data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/customers:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: listCPOCustomers
      summary: List customers for the authenticated CPO
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, BLOCKED]
      responses:
        "200":
          description: A paginated list of customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOCustomerListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/customers/{customer_id}:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOCustomer
      summary: Get a specific customer for the authenticated CPO
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - name: customer_id
