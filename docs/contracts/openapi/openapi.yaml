        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: Tariff or referenced tenant resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`tariff_conflict` or `tariff_schedule_conflict`."
          content:
            application/json:
              schema:
