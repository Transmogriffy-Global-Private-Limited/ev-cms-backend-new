  /api/v1/cpo/hubs/{hub_id}/chargers:
    parameters:
      - $ref: "#/components/parameters/HubID"
    get:
      tags: [CPO Operations - Network]
      operationId: listChargersByHub
      summary: List chargers by hub
      description: Get a list of chargers for a specific hub.
      security:
        - BearerAuth: []
        - CPOAppID: []
      responses:
        "200":
          description: Successfully retrieved chargers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [CPO Operations - Network]
      operationId: assignChargerToCPOHub
      summary: Assign or reassign a tenant charger to a hub
      description: |
        Requires CPO ADMIN. Assigns an existing charger of the same CPO to the
        specified hub. A charger may be created without a hub and assigned later.
        Repeating a request for the charger's current hub has no side effect.
        Moving an already assigned charger is atomic and audited. No tariff
        scope is changed: charger-targeted tariffs remain attached to
        the charger and hub-targeted tariffs remain attached to their hub.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [charger_id]
              properties:
                charger_id: {type: string, format: uuid}
      responses:
        "200":
          description: Charger successfully assigned or reassigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid body, hub ID, charger ID, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found` or `charger_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Tariff topology conflict prevents the requested reassignment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/hubs/{hub_id}/gst:
    post:
      tags:
        - "CPO Operations - Network"
      summary: "Assign a GST profile to a hub"
      description: "Assigns an existing GST profile to a charging hub. For a same-state Hub and GST, present SGST/CGST and zero IGST are required. For different states, present IGST and zero SGST/CGST are required. The same resulting-relationship validation protects replacement and later Hub/GST mutations. Invalid combinations return invalid_gst_for_hub."
      operationId: "assign-gst-to-hub"
      parameters:
        - name: "hub_id"
          in: "path"
          required: true
          description: "The ID of the hub."
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGSTToHubRequest"
      responses:
        "200":
          description: "Successfully assigned GST profile to hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Hub or GST not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags:
        - "CPO Operations - Network"
      summary: "Get the assigned GST profile for a hub"
      description: "Returns the GST profile currently assigned to the specified hub, if any."
      operationId: "getHubGST"
      parameters:
        - name: "hub_id"
          in: "path"
          required: true
          description: "The ID of the hub."
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Successfully retrieved GST profile."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GST"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "Hub not found or no GST assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags:
        - "CPO Operations - Network"
      summary: "Update the assigned GST profile for a hub"
      description: "Replaces the currently assigned GST with a new one. The new GST must belong to the same CPO and not be assigned to another hub. State-aware complete-relationship validation applies: same-state assignments require present SGST/CGST and zero IGST; different-state assignments require present IGST and zero SGST/CGST. Invalid combinations return invalid_gst_for_hub."
      operationId: "updateHubGST"
      parameters:
        - name: "hub_id"
          in: "path"
          required: true
          description: "The ID of the hub."
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGSTToHubRequest"
      responses:
        "200":
          description: "Successfully updated GST assignment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "Hub or GST not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "GST already assigned to another hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - "CPO Operations - Network"
      summary: "Unassign the GST profile from a hub"
      description: "Removes the currently assigned GST profile from the hub. The hub will then have no GST assigned."
      operationId: "unassignHubGST"
      parameters:
        - name: "hub_id"
          in: "path"
          required: true
          description: "The ID of the hub."
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Successfully unassigned GST."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "Hub not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"


