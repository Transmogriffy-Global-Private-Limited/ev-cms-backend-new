        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404": {description: Charger not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/events:
    get:
      tags: [CPO Operations - Live]
      operationId: listCPOOperationalEvents
      summary: Recover the tenant's retained operational events
      description: CPO ADMIN-only cursor recovery for committed runtime projection notifications. REST fleet and charger projections remain authoritative.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: Ordered retained operational events, content: {application/json: {schema: {$ref: "#/components/schemas/OperationalEventPage"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/realtime/stream:
    get:
      tags: [CPO Operations - Live]
      operationId: streamCPOOperationalEvents
      summary: Stream the tenant's retained operational events using SSE
      description: CPO ADMIN-only SSE. The server revalidates the bearer session on heartbeats; clients deduplicate by event ID and use REST cursor recovery after reconnect.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: text/event-stream of OperationalEvent records.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}

  /api/v1/cpo/operations/live-sessions:
    get:
      tags: [CPO Operations - Live]
      operationId: streamCPOLiveChargingSessions
      summary: Stream full materialized ongoing-session snapshots using SSE
      description: CPO ADMIN-only SSE. It immediately emits a `snapshot` frame and emits a replacement-safe `live_sessions` frame after committed CHARGING_SESSION changes. Each frame contains the complete current CMS live-session projection for the requested limit, including duration in seconds at `as_of`, the CPO-visible customer name, and CMS connector UUID, never raw event rows or HAL calls. Reconnect this route to receive a new current snapshot; use the explicit snapshot route for non-stream recovery.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/LiveSessionLimit"
      responses:
        "200": {description: "text/event-stream frames named `snapshot` and `live_sessions`; each data value is LiveChargingSessionListResponse.", content: {text/event-stream: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/live-sessions/snapshot:
    get:
      tags: [CPO Operations - Live]
      operationId: listCPOLiveChargingSessions
      summary: List materialized ongoing sessions with current operational telemetry
      description: CPO ADMIN-only CMS recovery snapshot. Returns only ACTIVE, STOP_PENDING, and RECONCILIATION_REQUIRED sessions in start-time cursor order. It exposes duration in seconds at `as_of`, the CPO-visible customer name, human-readable charger/hub context, CMS connector UUID, and committed meter/SoC values and freshness; it never calls HAL and does not expose customer contact data, wallet, tariff, or settlement data.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/LiveSessionLimit"
        - $ref: "#/components/parameters/LiveSessionAfterStartedAt"
        - $ref: "#/components/parameters/LiveSessionAfterID"
      responses:
        "200": {description: Current materialized ongoing sessions, content: {application/json: {schema: {$ref: "#/components/schemas/LiveChargingSessionListResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/live-sessions/events:
    get:
      tags: [CPO Operations - Live]
      operationId: listCPOLiveChargingSessionEvents
      summary: Recover retained live-session invalidation events
      description: CPO ADMIN-only durable replay filtered to CHARGING_SESSION events. This is an advanced cursor/reconciliation surface; the primary live-session UI consumes the full-snapshot SSE route. Event payload is not authoritative session state.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: Ordered retained live-session invalidations, content: {application/json: {schema: {$ref: "#/components/schemas/OperationalEventPage"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/live-sessions/realtime/stream:
    get:
      tags: [CPO Operations - Live]
      operationId: streamCPOLiveChargingSessionsLegacy
      summary: Legacy alias for the full live-session snapshot SSE stream
      description: Deprecated compatibility alias for `/api/v1/cpo/operations/live-sessions`. It immediately emits a complete `snapshot` and later `live_sessions` replacement snapshots. New clients must use the primary route.
      deprecated: true
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/LiveSessionLimit"
      responses:
        "200": {description: "text/event-stream frames named `snapshot` and `live_sessions`; each data value is LiveChargingSessionListResponse.", content: {text/event-stream: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}

  /api/v1/cpo/chargers:
    post:
      tags: [CPO Operations - Network]
      operationId: createCPOCharger
      summary: Register a CMS charger and its initial connectors
      description: |
        Requires the currently supported CPO ADMIN authority. The server generates the six
        character public `charger_id`, CMS UUIDs, and assigns that same new
        charger-facing value as `ocpp_identity`; callers do not source these
        identifiers. Existing rows retain their stored compatibility values. The charger,
        connectors, and audit record commit atomically. This is commercial CMS
        inventory only and does not create an OCPP connection in the HAL.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateChargerMultipartRequest"
            encoding:
              data:
                contentType: application/json
              charger_image:
                contentType: image/*
      responses:
        "201":
          description: Charger and connectors created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerResponse"
        "400":
          description: Invalid body, field, hub, connector, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found` — the tenant does not own the hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_conflict` or `connector_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations - Network]
      operationId: listCPOChargers
      summary: List tenant chargers with connectors
      description: |
        Requires the currently supported CPO ADMIN authority. Results use stable descending
        `(created_at, id)` keyset pagination and never cross the authenticated
        CPO boundary.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of chargers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers/{charger_id}:
    parameters:
      - $ref: "#/components/parameters/ChargerPublicID"
    get:
      tags: [CPO Operations - Network]
      operationId: getCPOCharger
      summary: Get one tenant charger and its connectors
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Charger detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations - Network]
      operationId: updateCPOCharger
      summary: Update a charger and selected existing connectors
      description: |
        Requires CPO ADMIN. Connector updates identify existing
        connectors by server-generated UUID and cannot add or remove
        connectors. Public charger ID, OCPP identity, OCPP version, charger and
        connector status, and last-seen time are read-only CMS projection fields.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateChargerMultipartRequest"
            encoding:
              data:
                contentType: application/json
              charger_image:
                contentType: image/*
      responses:
        "200":
          description: Updated charger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerResponse"
        "400":
          description: Invalid body, field, connector, charger ID, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`, `connector_not_found`, or `hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Charger or connector uniqueness/reference conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Operations - Network]
      operationId: deleteCPOCharger
      summary: Delete an unused charger and its connectors
      description: |
        Requires CPO ADMIN. The charger and connectors are
        deleted transactionally and the action is audited. PostgreSQL rejects
        deletion while tariffs, charging sessions, access links, favourites,
        or other dependent records still reference the charger.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Charger deleted; no response body.
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_in_use` — dependent durable records prevent deletion."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

