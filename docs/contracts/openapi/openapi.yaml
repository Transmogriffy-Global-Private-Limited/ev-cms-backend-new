      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MailRetentionRequest"}}}}
      responses:
        "200": {description: Retention count., content: {application/json: {schema: {$ref: "#/components/schemas/MailRetentionResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/announcements:
    get:
      tags: [Superadmin Governance]
      operationId: listPlatformAnnouncements
      summary: List platform announcements
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ListBefore"}, {$ref: "#/components/parameters/ListBeforeID"}, {$ref: "#/components/parameters/ListLimit"}]
      responses:
        "200": {description: Announcements and recipient counts., content: {application/json: {schema: {$ref: "#/components/schemas/AnnouncementPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      tags: [Superadmin Governance]
      operationId: createPlatformAnnouncement
      summary: Create a platform or CPO announcement
      description: Creates an immutable audience snapshot and durable notification records in one transaction.
      security: [{BearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AnnouncementRequest"}}}}
      responses:
        "201": {description: Created announcement., content: {application/json: {schema: {$ref: "#/components/schemas/Announcement"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/CPONotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/notifications:
    get:
      tags: [Superadmin Governance]
      operationId: listPlatformNotifications
      summary: List the current Superadmin's notifications
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ListBefore"}, {$ref: "#/components/parameters/ListBeforeID"}, {$ref: "#/components/parameters/ListLimit"}, {name: unread_only, in: query, schema: {type: boolean, default: false}}]
      responses:
        "200": {description: Durable notification page., content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/notifications/{notification_id}/read:
    post:
      tags: [Superadmin Governance]
      operationId: markPlatformNotificationRead
      summary: Mark a platform notification read
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/NotificationID"}]
      responses:
        "204": {description: Notification marked read.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotificationNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/overview:
    get:
      tags: [Superadmin Governance]
      operationId: getPlatformOverview
      summary: Get bounded platform overview aggregates
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Bounded platform aggregates., content: {application/json: {schema: {$ref: "#/components/schemas/OverviewResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/status:
    get:
      tags: [Superadmin Governance]
      operationId: getPlatformStatus
      summary: Get service, database, and worker status
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Platform status., content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos:
    post:
      tags: [Platform CPOs]
      operationId: createCPO
      summary: Create a pending CPO and its first administrator
      description: |
        Atomically creates a pending CPO with no commercial prerequisite, a
        unique dummy app ID, an ADMIN membership, audit data, and an encrypted
        onboarding mail job. A new email receives a generated temporary
        password; an existing active identity keeps its password. The
        temporary password never appears in the response. The transaction
        fails rather than queueing a new-identity welcome without that
        credential; a successful response proves the job committed, not that
        SMTP has sent it.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCPORequest"
      responses:
        "201":
          description: CPO and first administrator created or attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCPOResponse"
        "400":
          description: |
            `invalid_request`, `invalid_slug`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, `invalid_address`,
            `invalid_city`, `invalid_state`, `invalid_pincode`,
            `invalid_admin_email`, or `invalid_admin_full_name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `cpo_slug_conflict`, `cpo_gstin_conflict`,
            `cpo_app_id_conflict`, `admin_identity_conflict`,
            `cpo_admin_membership_conflict`, `cpo_primary_admin_conflict`,
            `admin_identity_inactive`, or the fallback `cpo_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Platform CPOs]
      operationId: listCPOs
      summary: Search and cursor-page CPOs
      description: |
        Returns a stable newest-first page. Search matches business name, slug,
        GSTIN, app ID, and the designated primary administrator's name/email.
        When `has_more` is true, send both returned cursor fields unchanged.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, SUSPENDED]
        - name: app_id_mode
          in: query
          schema:
            $ref: "#/components/schemas/CPOAppIDMode"
        - name: before
          in: query
          description: Exclusive RFC3339 creation-time cursor; requires before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: Exclusive UUID tie-breaker; requires before.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: CPO collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOListResponse"
        "400":
          description: |
            `invalid_q`, `invalid_status`, `invalid_app_id_mode`,
            `invalid_before`, `invalid_before_id`, `invalid_cursor`, or
            `invalid_limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/slug-availability:
    get:
      tags: [Platform CPOs]
      operationId: checkCPOSlugAvailability
      summary: Check whether a normalized CPO slug is currently available
      description: |
        Trims and lowercases the candidate, validates the same format used by
        CPO creation, and reports whether the normalized slug is currently
        unallocated. This read is advisory: concurrent creation can consume an
        available slug, so POST /api/v1/platform/cpos remains authoritative and
        can still return cpo_slug_conflict.
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          description: Candidate CPO slug. The server trims and lowercases it.
          schema:
            type: string
            maxLength: 80
            pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
      responses:
        "200":
          description: Current availability of the normalized candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOSlugAvailability"
        "400":
          description: "`invalid_slug`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}:
    get:
      tags: [Platform CPOs]
      operationId: getCPO
      summary: Get one CPO
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/profile:
    put:
      tags: [Platform CPOs]
      operationId: updateCPOProfile
      summary: Replace the mutable CPO business profile
      description: |
        Replaces business-profile fields in one transaction and emits audit and
        realtime evidence. The stable slug, lifecycle, app ID, and tenant data
        are not changed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOProfileRequest"
      responses:
        "200":
          description: Updated CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, `invalid_address`,
            `invalid_city`, `invalid_state`, or `invalid_pincode`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_gstin_conflict` — GSTIN is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/activate:
    post:
      tags: [Platform CPOs]
      operationId: activateCPO
      summary: Set a CPO active
      description: |
        Idempotently grants platform access by setting the CPO lifecycle status
        to ACTIVE. A live app ID is not required. CPO administrative login
        becomes eligible.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current active CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/suspend:
    post:
      tags: [Platform CPOs]
      operationId: suspendCPO
      summary: Suspend a CPO and revoke its sessions
      description: |
        Idempotently sets status to SUSPENDED and revokes every active CPO-staff
        and customer session plus unused refresh tokens for the tenant. New
        tenant login is blocked. Platform sessions are unaffected.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current suspended CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/app-id:
    put:
      tags: [Platform CPOs]
      operationId: setLiveCPOAppID
      summary: Assign or rotate the live CPO app ID
      description: |
        Normalizes the supplied value to lowercase and replaces the current
        dummy or live ID immediately. Existing sessions stay valid, but tenant
        business requests must use the new header value. The reserved
        `cpo_dummy_` prefix is forbidden.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCPOAppIDRequest"
      responses:
        "200":
          description: CPO with current LIVE app identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_cpo_app_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_app_id_conflict` — app ID is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin:
    get:
      tags: [Platform CPOs]
      operationId: getCPOPrimaryAdmin
      summary: Get the designated primary administrator
      description: |
        Returns identity/membership state and only safe metadata for the latest
        correlated onboarding mail. Mail ciphertext and delivery errors are not
        exposed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: Current primary administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Platform CPOs]
      operationId: setCPOPrimaryAdmin
      summary: Restore or replace the primary administrator
      description: |
        Serializes changes per CPO and normalized email. An existing active
        identity keeps its password. A new identity receives a generated
        temporary password only through encrypted onboarding mail, and an
        incomplete welcome payload fails the transaction. Replacing
        the administrator revokes the previous administrator's CPO sessions
        and membership in the same transaction. Repeating the already-active
        assignment is a side-effect-free success.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrimaryAdminRequest"
      responses:
        "200":
          description: Current primary administrator after the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_email`,
            `invalid_full_name`, or `invalid_reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: |
            `admin_identity_inactive`, `admin_identity_conflict`,
            `cpo_admin_membership_conflict`, `cpo_primary_admin_conflict`,
            or the fallback `cpo_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin/resend-onboarding:
    post:
      tags: [Platform CPOs]
      operationId: resendCPOPrimaryAdminOnboarding
      summary: Queue a credential-free onboarding recovery email
      description: |
        Queues an encrypted mail containing current CPO/app details and directs
        the active primary administrator to normal password recovery. Existing
        or generated passwords are never sent by this operation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "202":
          description: Mail queued; response contains the resulting safe metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`primary_admin_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/administrative-sessions/revoke:
    post:
      tags: [Platform CPOs]
      operationId: revokeCPOAdministrativeSessions
      summary: Revoke every active CPO-staff session
      description: |
        Revokes only CPO administrative sessions and their unused refresh
        tokens. Customer sessions, platform sessions, memberships, CPO
        lifecycle, and tenant data are unchanged. Repeating the command is safe
        and returns zero counts when no active sessions remain.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Revocation counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResponse"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/notifications:
    get:
      tags: [CPO Operations]
      operationId: listCPONotifications
      summary: List notifications for the authenticated CPO administrator
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - {$ref: "#/components/parameters/ListBefore"}
        - {$ref: "#/components/parameters/ListBeforeID"}
        - {$ref: "#/components/parameters/ListLimit"}
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: Durable CPO notification page., content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPage"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/notifications/{notification_id}/read:
    post:
      tags: [CPO Operations]
      operationId: markCPONotificationRead
      summary: Mark a CPO notification read
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - {$ref: "#/components/parameters/NotificationID"}
      responses:
        "204": {description: Notification marked read.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404": {$ref: "#/components/responses/NotificationNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/organization:
    get:
      tags: [CPO Operations]
      operationId: getCPOOrganization
      summary: Read the authenticated CPO's organization details
      description: |
        Returns a tenant-safe, read-only projection of the CPO registration
        and operational identity managed by the platform. The CPO ID is
        derived from the verified ADMIN session; callers cannot select another
        tenant. Internal platform actor IDs and the privileged lifecycle reason
        are omitted. Organization changes remain Superadmin-only.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current CPO organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOOrganization"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/subscription:
    get:
      tags: [CPO Operations]
      operationId: getCPOSubscription
      summary: Get the current CPO subscription
      description: Returns the subscription details for the authenticated CPO.
      security:
        - BearerAuth: []
        - CPOAppID: []
      responses:
        "200":
          description: The CPO's current subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOSubscriptionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: Subscription not found for this CPO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: subscription_not_found
                  message: No subscription found for this CPO.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/admin/profile:
    get:
      tags: [CPO Operations]
      operationId: getCPOAdminProfile
      summary: Read the authenticated CPO administrator profile
      description: |
        Returns the global login identity fields used by the current CPO ADMIN
        session, including optional phone. `/api/v1/auth/me` remains the
        canonical authentication/bootstrap response. This route does not return
        or edit the CPO organization record.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current administrator identity profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations]
      operationId: updateCPOAdminProfile
      summary: Update the authenticated administrator name or phone
      description: |
        Updates the global identity used by this ADMIN session and writes
        `CPO_ADMIN_PROFILE_UPDATED` audit evidence. Email and role are
        immutable here. A blank phone clears it; blank full name is invalid.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOAdminProfileRequest"
      responses:
        "200":
          description: Updated administrator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          description: Invalid body, profile field, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/users/{user_id}:
    get:
      tags: [CPO Operations]
      operationId: getCPOUser
      summary: Read one staff identity registered to the authenticated CPO
      description: |
        Returns basic identity and membership fields only when the user has a
        staff membership in the trusted CPO. Customer accounts are separate and
        cannot be read here. This is a point lookup, not a staff directory; the caller cannot
        select another tenant and an unlinked ID receives the same not-found
        response as an unknown ID.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: UUID of the user to read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details for the authenticated CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOUser"
        "400":
          description: "`invalid_user_id` or missing app-ID header."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`user_not_found` — the user is not registered to this CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers:
    post:
      tags: [CPO Operations]
      operationId: createCPOCharger
      summary: Register a CMS charger and its initial connectors
      description: |
        Requires the currently supported CPO ADMIN authority. The server generates the six
        character public `charger_id`, CMS UUIDs, and a globally unique
        `ocpp_identity`; callers do not source these identifiers. The charger,
        connectors, and audit record commit atomically. This is commercial CMS
        inventory only and does not create an OCPP connection in the HAL.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateChargerMultipartRequest"
            encoding:
              data:
                contentType: application/json
              charger_image:
                contentType: image/*
      responses:
        "201":
          description: Charger and connectors created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerResponse"
        "400":
          description: Invalid body, field, hub, connector, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found` — the tenant does not own the hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_conflict` or `connector_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations]
      operationId: listCPOChargers
      summary: List tenant chargers with connectors
      description: |
        Requires the currently supported CPO ADMIN authority. Results use stable descending
        `(created_at, id)` keyset pagination and never cross the authenticated
        CPO boundary.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of chargers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers/{charger_id}:
    parameters:
      - $ref: "#/components/parameters/ChargerPublicID"
    get:
      tags: [CPO Operations]
      operationId: getCPOCharger
      summary: Get one tenant charger and its connectors
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Charger detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations]
      operationId: updateCPOCharger
      summary: Update a charger and selected existing connectors
      description: |
        Requires CPO ADMIN. Connector updates identify existing
        connectors by server-generated UUID and cannot add or remove
        connectors. Public charger ID, OCPP identity, OCPP version, charger and
        connector status, and last-seen time are read-only CMS projection fields.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateChargerMultipartRequest"
            encoding:
              data:
                contentType: application/json
              charger_image:
                contentType: image/*
      responses:
        "200":
          description: Updated charger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerResponse"
        "400":
          description: Invalid body, field, connector, charger ID, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`, `connector_not_found`, or `hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Charger or connector uniqueness/reference conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Operations]
      operationId: deleteCPOCharger
      summary: Delete an unused charger and its connectors
      description: |
        Requires CPO ADMIN. The charger and connectors are
        deleted transactionally and the action is audited. PostgreSQL rejects
        deletion while tariffs, charging sessions, access links, favourites,
        or other dependent records still reference the charger.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Charger deleted; no response body.
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_in_use` — dependent durable records prevent deletion."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs:
    post:
      tags: [CPO Operations]
      operationId: createCPOHub
      summary: Create a tenant charging hub
      description: |
        Requires CPO ADMIN and writes audit evidence atomically. Optionally
        assigns existing tenant chargers, which must not already belong to a hub.
      security:
        - BearerAuth: []
