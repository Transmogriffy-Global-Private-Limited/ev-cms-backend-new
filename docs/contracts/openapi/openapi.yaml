        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/AuthScope"
        cpo_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CPORole"
        ip_address:
          type: string
        user_agent:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    CreateCPORequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - business_name
        - company_type
        - gstin
        - address
        - city
        - state
        - pincode
        - admin
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
          description: Trimmed/lowercased by the server and globally unique; words separated by single hyphens.
        business_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required display/legal business name. The server collapses whitespace and rejects control-only or punctuation-only values.
        company_type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        gstin:
          type: string
          pattern: "^(0[1-9]|[12][0-9]|3[0-8])[A-Za-z]{5}[0-9]{4}[A-Za-z][1-9A-Za-z][Zz][0-9A-Za-z]$"
          description: Required and globally unique after uppercasing. The server also verifies the GSTIN checksum and requires its state code to match `state`.
        address:
          type: string
          minLength: 1
          maxLength: 5000
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        pincode:
          type: string
          pattern: "^[1-9][0-9]{5}$"
          description: Six-digit Indian PIN code.
        admin:
          $ref: "#/components/schemas/InitialAdminRequest"

    InitialAdminRequest:
      type: object
      additionalProperties: false
      required: [email, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required human name; whitespace is collapsed and the value must contain a letter.

    SetCPOAppIDRequest:
      type: object
      additionalProperties: false
      required: [app_id]
      properties:
        app_id:
          type: string
          minLength: 16
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{16,100}$"
          description: Lowercased by the server; must not start with cpo_dummy_.

    UpdateCPOProfileRequest:
      type: object
      additionalProperties: false
      required:
        - business_name
        - company_type
        - gstin
        - address
        - city
        - state
        - pincode
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required display/legal business name. The server collapses whitespace and rejects control-only or punctuation-only values.
        company_type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        gstin:
          type: string
          pattern: "^(0[1-9]|[12][0-9]|3[0-8])[A-Za-z]{5}[0-9]{4}[A-Za-z][1-9A-Za-z][Zz][0-9A-Za-z]$"
          description: Required and globally unique after uppercasing. The server also verifies the GSTIN checksum and requires its state code to match `state`.
        address:
          type: string
          minLength: 1
          maxLength: 5000
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        pincode:
          type: string
          pattern: "^[1-9][0-9]{5}$"
          description: Six-digit Indian PIN code.

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Trimmed human reason retained in privileged audit evidence.

    SetPrimaryAdminRequest:
      type: object
      additionalProperties: false
      required: [email, full_name, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required human name; whitespace is collapsed and the value must contain a letter. Used only when a new global identity must be created.
        reason:
          type: string
          minLength: 3
          maxLength: 500

    CPO:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - business_name
        - company_type
        - gstin
        - address
        - city
        - state
        - pincode
        - status
        - status_reason
