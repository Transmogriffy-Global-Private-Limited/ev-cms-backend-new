      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Revocation counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResponse"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/notifications:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: listCPONotifications
      summary: List notifications for the authenticated CPO administrator
      security:
        - BearerAuth: []
          CPOAppID: []
