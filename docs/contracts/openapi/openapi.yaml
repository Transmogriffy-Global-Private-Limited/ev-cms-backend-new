openapi: 3.1.0
info:
  title: TransEV EV CMS API
  version: 0.11.0
  description: |
    Canonical machine-readable contract for the endpoints currently implemented
    by `ev-cms-backend-new`.

    Authentication uses a signed-then-encrypted bearer access token. Platform
    sessions and CPO sessions are separate. CPO integration operations also
    require `X-CPO-App-ID`; that header is checked only after the bearer token
    establishes the CPO and never selects a tenant.

    Public customer signup requires `X-CPO-App-ID` to resolve an active CPO, but
    the header remains public routing metadata rather than authentication.
    Administrative authentication, platform control-plane, health, and
    documentation routes do not require it. Request bodies reject unknown
    properties and are limited to 32 KiB by the server.

    Every request that reaches Gin returns a server-generated UUID in the
    `X-Request-ID` response header for correlation with the safe structured
    completion log. The logger records matched route templates and stable
    handled error codes, never bodies, raw paths, queries, credentials, tokens,
    OTPs, email addresses, user agents, app IDs, API messages, or panic values.
    `LOG_LEVEL=DEBUG` adds request-start and handled-error component/type
    diagnostics under the same request ID without relaxing those exclusions.
  contact:
    name: TransEV Engineering
servers:
  - url: /
    description: Same origin as the API documentation page
tags:
  - name: Health
    description: Process liveness and PostgreSQL readiness.
  - name: Authentication
    description: Password, email OTP, token, password, and session operations.
  - name: App User Authentication
    description: Public signup and complete customer credential/session operations.
  - name: Superadmin - Platform CPOs
    description: Platform-superadmin CPO provisioning and lifecycle control.
  - name: Superadmin - Platform Operations
    description: Durable audit, event recovery, worker health, and realtime operations.
  - name: Superadmin - Governance
    description: Platform authority, security, mail, communication, and bounded status operations.
  - name: Superadmin - Manual Subscriptions
    description: Platform-superadmin issued subscription plans and periods without a payment provider or automatic lifecycle worker.
  - name: CPO Operations - Account & Notifications
    description: Tenant-scoped organization, administrator profile, subscription, user lookup, and notification operations.
  - name: CPO Operations - Network
    description: Tenant-scoped hub and charger inventory, publication, status, and image operations.
  - name: CPO Operations - Pricing & Tax
    description: Tenant-scoped tariff and GST profile operations.
  - name: CPO Operations - Integrations
    description: CPO ADMIN write-only integration credential management.
  - name: App Charging
    description: Customer-owned charging progress, active-session projection, and stop commands. HAL protocol facts are received through a separate service boundary.
  - name: CPO Operations - Charging Sessions
    description: Tenant-scoped charging session operations.
  - name: HAL Service Integration
    description: Authenticated OCPP HAL fact receiver. Not callable with a customer or staff bearer.

paths:
  /api/v1/cpo/support:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: listCPOSupportTickets
      summary: List this CPO's support tickets
      security: [{BearerAuth: [], CPOAppID: []}]
      responses: {"200": {description: Tickets., content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SupportTicket"}}}}}}
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: createCPOSupportTicket
      summary: Open a CPO support ticket
      security: [{BearerAuth: [], CPOAppID: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSupportTicketRequest"}}}}
      responses: {"201": {description: Created ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}
  /api/v1/cpo/support/{ticket_id}:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOSupportTicket
      summary: Get one CPO support ticket
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/SupportTicketID"}]
      responses: {"200": {description: Ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}
  /api/v1/cpo/support/{ticket_id}/replies:
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: replyToCPOSupportTicket
      summary: Reply to a CPO support ticket
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/SupportTicketID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupportReplyRequest"}}}}
      responses: {"200": {description: Updated ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}
  /api/v1/platform/support/tickets:
    get:
      tags: [Superadmin - Governance]
      operationId: listPlatformSupportTickets
      summary: List all tenant support tickets
      security: [{BearerAuth: []}]
      responses: {"200": {description: Tickets., content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SupportTicket"}}}}}}
  /api/v1/platform/support/tickets/{ticket_id}:
    get:
      tags: [Superadmin - Governance]
      operationId: getPlatformSupportTicket
      summary: Get one support ticket
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SupportTicketID"}]
      responses: {"200": {description: Ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}
  /api/v1/platform/support/tickets/{ticket_id}/replies:
    post:
      tags: [Superadmin - Governance]
      operationId: replyToPlatformSupportTicket
      summary: Reply as platform staff
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SupportTicketID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupportReplyRequest"}}}}
      responses: {"200": {description: Updated ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}
  /api/v1/platform/support/tickets/{ticket_id}/status:
    patch:
      tags: [Superadmin - Governance]
      operationId: updatePlatformSupportTicketStatus
      summary: Set platform-owned support ticket status
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/SupportTicketID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicketStatusRequest"}}}}
      responses: {"200": {description: Updated ticket., content: {application/json: {schema: {$ref: "#/components/schemas/SupportTicket"}}}}}

  /api/v1/cpo/permissions/catalog:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: listCPOPermissionCatalog
      summary: List the source-controlled CPO permission catalog
      security: [{BearerAuth: []}, {CPOAppID: []}]
      responses:
        "200": {description: Known permission definitions., content: {application/json: {schema: {$ref: "#/components/schemas/PermissionCatalogResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
  /api/v1/cpo/staff:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: listCPOStaff
      summary: List CPO staff memberships and overrides
      security: [{BearerAuth: []}, {CPOAppID: []}]
      responses:
        "200": {description: CPO staff., content: {application/json: {schema: {$ref: "#/components/schemas/StaffListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: createCPOStaff
      summary: Create a non-primary CPO staff membership
      security: [{BearerAuth: []}, {CPOAppID: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateStaffRequest"}}}}
      responses:
        "201": {description: Created staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/cpo/staff/{membership_id}:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOStaff
      summary: Get one CPO staff membership
      security: [{BearerAuth: []}, {CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/MembershipID"}]
      responses:
        "200": {description: CPO staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404": {description: "`staff_not_found`"}
    patch:
      tags: [CPO Operations - Account & Notifications]
      operationId: updateCPOStaff
      summary: Update a non-primary staff role or override set
      security: [{BearerAuth: []}, {CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/MembershipID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateStaffRequest"}}}}
      responses:
        "200": {description: Updated staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404": {description: "`staff_not_found`"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/cpo/staff/{membership_id}/activate:
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: activateCPOStaff
      summary: Activate a non-primary staff membership
      security: [{BearerAuth: []}, {CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/MembershipID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReasonRequest"}}}}
      responses: {"200": {description: Updated staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}, "400": {$ref: "#/components/responses/InvalidRequest"}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {$ref: "#/components/responses/CPOBusinessForbidden"}, "404": {description: "`staff_not_found`"}, "409": {$ref: "#/components/responses/Conflict"}}
  /api/v1/cpo/staff/{membership_id}/suspend:
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: suspendCPOStaff
      summary: Suspend a non-primary staff membership and revoke its CPO sessions
      security: [{BearerAuth: []}, {CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/MembershipID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReasonRequest"}}}}
      responses: {"200": {description: Updated staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}, "400": {$ref: "#/components/responses/InvalidRequest"}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {$ref: "#/components/responses/CPOBusinessForbidden"}, "404": {description: "`staff_not_found`"}, "409": {$ref: "#/components/responses/Conflict"}}
  /api/v1/cpo/staff/{membership_id}/revoke:
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: revokeCPOStaff
      summary: Revoke a non-primary staff membership and its CPO sessions
      security: [{BearerAuth: []}, {CPOAppID: []}]
      parameters: [{$ref: "#/components/parameters/MembershipID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReasonRequest"}}}}
      responses: {"200": {description: Updated staff membership., content: {application/json: {schema: {$ref: "#/components/schemas/Staff"}}}}, "400": {$ref: "#/components/responses/InvalidRequest"}, "401": {$ref: "#/components/responses/Unauthorized"}, "403": {$ref: "#/components/responses/CPOBusinessForbidden"}, "404": {description: "`staff_not_found`"}, "409": {$ref: "#/components/responses/Conflict"}}

  /api/v1/cpo/charging-sessions:
    get:
      tags: [CPO Operations - Charging Sessions]
      operationId: listCPOChargingSessions
      summary: List charging sessions for the CPO
      description: Returns a paginated list of charging sessions for the authenticated CPO, ordered by newest first.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: charger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of charging sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSessionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/charging-sessions/{session_id}:
    get:
      tags: [CPO Operations - Charging Sessions]
      operationId: getCPOChargingSession
      summary: Get a single charging session
      description: Returns a single charging session by ID.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested charging session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingSessionView"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charging_session_not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/charger-transactions:
    get:
      tags: [CPO Operations - Charging Sessions]
      operationId: listCPOChargerTransactions
      summary: List charger transactions for the CPO
      description: Returns a paginated list of charger transactions for the authenticated CPO, ordered by newest first.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - name: charger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of charger transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerTransactionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/wallet-transactions:
    get:
      tags: [CPO Operations - Charging Sessions]
      operationId: listCPOWalletTransactions
      summary: List wallet transactions for the CPO
      description: Returns a paginated list of wallet transactions for all customers of the authenticated CPO, ordered by newest first.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter transactions by a specific customer.
      responses:
        "200":
          description: A list of wallet transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/customers/{customer_id}/wallet-transactions:
    get:
      tags: [CPO Operations - Charging Sessions]
      operationId: listCPOCustomerWalletTransactions
      summary: List wallet transactions for a specific customer
      description: Returns a paginated list of wallet transactions for a given customer of the authenticated CPO, ordered by newest first.
      security:
        - BearerAuth: []
        - CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/CustomerID"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
      responses:
        "200":
          description: A list of wallet transactions for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`customer_not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      description: |
        Returns success when the HTTP process is running. It does not query
        PostgreSQL and must not be used as a database-readiness signal.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      description: Queries PostgreSQL with a two-second timeout.
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: PostgreSQL is absent, unavailable, or did not respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not_ready

  /api/v1/app/auth/signup:
    post:
      tags: [App User Authentication]
      operationId: startCustomerSignup
      summary: Start CPO-scoped customer signup
      description: |
        Resolves an active CPO from its current app ID, validates the proposed
        profile and password, stores only an Argon2id password hash, and queues
        an encrypted email-OTP job. No customer account exists yet.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSignupRequest"
      responses:
        "202":
          description: Durable signup challenge and mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Invalid JSON, app-ID header, email, password, name, or phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`signup_unavailable` — app ID does not resolve an active CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/signup/verify:
    post:
      tags: [App User Authentication]
      operationId: verifyCustomerSignup
      summary: Verify email and create the CPO customer
      description: |
        Verifies and consumes the CPO-bound OTP. In one transaction it creates
        a CPO-local customer account with its own credentials and profile, a
        zero-balance INR wallet, and a tenant audit event. The same email may
        independently register under another CPO.
        This endpoint does not issue customer login tokens.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
      responses:
        "201":
          description: Customer and wallet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSignupResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "403":
          description: "`signup_unavailable` — CPO app identity is unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`customer_already_registered` — email is already registered under this CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/signup/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerSignupOTP
      summary: Replace an eligible signup challenge
      description: |
        After the cooldown, invalidates an unconsumed challenge and creates a
        replacement carrying the same password hash and proposed profile. CPO
        app identity and active lifecycle are revalidated.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement challenge and mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login:
    post:
      tags: [App User Authentication]
      operationId: startCustomerLogin
      summary: Validate a customer password and start mail OTP
      description: |
        Resolves the active CPO by app ID, validates that CPO's customer account
        password, status, and lockout state, then durably queues a login OTP.
        Invalid account, password, lockout, and status collapse to
        `invalid_credentials`.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
      responses:
        "202":
          description: Customer login challenge and encrypted mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — credentials or customer authority are invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`signup_unavailable` — app ID does not resolve an active CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login/verify:
    post:
      tags: [App User Authentication]
      operationId: verifyCustomerLogin
      summary: Verify customer login OTP and create a session
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
      responses:
        "200":
          description: Customer session and rotating refresh lineage created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerLoginOTP
      summary: Replace an eligible customer login challenge
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement customer login challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/refresh:
    post:
      tags: [App User Authentication]
      operationId: rotateCustomerRefreshToken
      summary: Rotate a customer refresh token
      description: |
        Accepts the current opaque token once, revalidates customer, CPO,
        session, and app-ID state, and atomically returns a replacement.
        Consumed-token reuse revokes the complete customer session.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Customer refresh token rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_refresh_token` — invalid, expired, revoked, reused, or no longer authorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/forgot:
    post:
      tags: [App User Authentication]
      operationId: startCustomerPasswordRecovery
      summary: Start enumeration-safe customer password recovery
      description: |
        Creates the challenge and encrypted mail job for an eligible customer.
        The generic response contains no challenge material. The eligible
        recipient's email contains the recovery ID, code, and expiry required
        by reset-resend or completion.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Generic response whether or not an eligible customer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: App ID does not resolve an active CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/reset/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerPasswordResetOTP
      summary: Replace an eligible customer password-reset challenge
      description: |
        Requires the recovery ID delivered to the eligible recipient by email.
        Success invalidates the old pair and returns a replacement challenge;
        the replacement email carries the new ID and code.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement password-reset challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/reset:
    post:
      tags: [App User Authentication]
      operationId: resetCustomerPassword
      summary: Consume a customer reset OTP and replace its CPO-local password
      description: |
        Uses the recovery ID and code delivered to the eligible recipient by
        email. Success revokes every session and invalidates every other
        unconsumed auth challenge for only this CPO customer account.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and every session for this CPO customer revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request or password policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/me:
    get:
      tags: [App User Authentication]
      operationId: getCurrentCustomer
      summary: Get the current app-user bootstrap payload
      description: |
        Returns the validated CPO-local account projection, customer state, CPO
        application identity, and customer wallet. `user.id` and `customer.id`
        are the same CPO-local customer UUID; no global users row is involved.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200":
          description: Current customer application context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMeResponse"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/profile:
    patch:
      tags: [App User Authentication]
      operationId: updateCurrentCustomerProfile
      summary: Update the current customer profile
      description: |
        Updates only the authenticated CPO-local customer's display name and
        phone. The customer and CPO are derived from the validated bearer
        session; no customer or CPO identifier is accepted. Omitting `phone`
        preserves it, while explicit JSON null clears it. Email, password,
        status, group, wallet, sessions, and identifiers are immutable here.
        Successful changes write one CPO-scoped audit record containing field
        names only, never old or new personal values.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerProfileRequest"
            examples:
              update:
                value:
                  full_name: Asha Das
                  phone: "+919876543210"
              clearPhone:
                value:
                  full_name: Asha Das
                  phone: null
      responses:
        "200":
          description: Updated canonical customer user projection.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerUser"
        "400":
          description: Invalid JSON, full name, phone, or unknown field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/hubs:
    get:
      tags: [App User Network]
      operationId: listCustomerHubs
      summary: List published charging hubs for the current customer CPO
      description: |
        Returns only hubs explicitly published by the current CPO and never
        crosses the CPO from the validated customer session. Results use
        bounded descending keyset pagination. Search and cursor values are
        client-owned query state; when search changes, the client must discard
        the old cursor. Favorite flags are customer-owned. No HAL call occurs;
        live availability is not represented by this read model.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 255}
          description: Case-insensitive name or address search.
      responses:
        "200":
          description: Published hubs visible to the current customer CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerHubListResponse"
        "400":
          description: Invalid limit, cursor, search, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/hubs/{hub_id}:
    get:
      tags: [App User Network]
      operationId: getCustomerHub
      summary: Get one published hub and its attached chargers
      description: |
        Returns a safe customer projection only when the hub belongs to the
        authenticated customer CPO and is published. Unassigned chargers are
        excluded. Connector and charger availability are `UNKNOWN` until the
        separate CMS/HAL integration is implemented; stored CMS status is not
        presented as live status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/HubID"
      responses:
        "200":
          description: Published customer hub detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerHub"
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "`hub_not_found` for an unknown, unpublished, or cross-CPO hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/hubs/{hub_id}/price:
    get:
      tags: [App User Network]
      operationId: getCustomerHubPrice
      summary: Get the current informational hub price
      description: |
        Resolves the current active effective hub tariff on the server. The
        result is informational and is not a charging or payment commitment.
        A missing eligible tariff returns HTTP 200 with status `UNAVAILABLE`,
        never a zero price. When the authenticated customer has an existing
        user-group assignment, its matching UserGroup tariff takes precedence
        over the hub tariff. This hub-only route has no charger context.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/HubID"
      responses:
        "200":
          description: Current price state for the published hub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPriceResponse"
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: "`hub_not_found` for unknown, unpublished, or cross-CPO hub."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/chargers/{charger_id}:
    get:
      tags: [App User Network]
      operationId: getCustomerCharger
      summary: Get one charger attached to a published hub
      description: |
        Uses the six-character public charger ID. The charger is returned only
        when it belongs to the customer CPO and is attached to a published hub.
        OCPP identity, serial number, and last-seen data are intentionally
        omitted. Static CMS administrative status is separate from live
        availability, which remains `UNKNOWN` until HAL integration.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "200":
          description: Published customer charger detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCharger"
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "`charger_not_found` for an unknown, unpublished, unassigned, or cross-CPO charger."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/chargers/{charger_id}/image:
    get:
      tags: [App User Network]
      operationId: getCustomerChargerImage
      summary: Download the uploaded image for one published charger
      description: Uses the six-character public charger ID and the same customer/CPO/published-hub boundary as charger detail. The returned image requires Bearer and `X-CPO-App-ID` headers; fetch it as a blob rather than using an unauthenticated browser image request.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "200":
          description: Uploaded JPEG, PNG, GIF, or WebP charger image.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: "`charger_not_found` for inaccessible inventory, or `charger_image_not_found` when no safe uploaded image exists."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/cpo/chargers/{charger_id}/customer-visibility:
    parameters:
      - $ref: "#/components/parameters/ChargerPublicID"
    put:
      tags: [CPO Operations - Network]
      operationId: updateCPOChargerCustomerVisibility
      summary: Publish or unpublish a charger from User App discovery
      description: |
        Requires CPO ADMIN and atomically changes the charger's `customer_visibility`
        publication gate. Unpublished chargers are omitted from User App discovery
        and favorites, even if their hub is published. Existing sessions and
        active charging are unaffected.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChargerCustomerVisibilityRequest"
      responses:
        "200":
          description: Updated charger projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerResponse"
        "400":
          description: Invalid charger ID, body, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/chargers:
    get:
      tags: [App User Network]
      operationId: listCustomerChargers
      summary: Search published chargers for the current customer CPO
      description: |
        Returns chargers attached to published hubs in the authenticated
        customer CPO. Supports text, connector-type, power, open-24-hours,
        and optional location filters. Supplying `lat` and `lng` enables a
        near-me search within `radius_km` (default 10 km), ordered by distance.
        Location searches are bounded but do not expose a continuation cursor.
        Availability remains `UNKNOWN` until HAL integration; stored CMS status
        is not presented as live availability.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
        - name: q
          in: query
          schema: {type: string, maxLength: 255}
          description: Case-insensitive charger, vendor, model, hub, or address search.
        - name: connector_type
          in: query
          schema: {type: string, maxLength: 50}
        - name: min_power_kw
          in: query
          schema: {type: number, minimum: 0}
        - name: max_power_kw
          in: query
          schema: {type: number, minimum: 0}
        - name: open_24_hours
          in: query
          schema: {type: boolean}
        - name: lat
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
          description: Current customer latitude; required together with lng for near-me search.
        - name: lng
          in: query
          schema: {type: number, minimum: -180, maximum: 180}
        - name: radius_km
          in: query
          schema: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 100}
          description: Must be greater than zero; defaults to 10 km.
      responses:
        "200":
          description: Published customer chargers matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerChargerListResponse"
        "400":
          description: Invalid filter, location, power range, limit, or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/chargers/locations:
    get:
      tags: [App User Network]
      operationId: listCustomerChargerLocations
      summary: List compact map locations for published chargers
      description: |
        Applies the same published-hub, current-CPO, text, connector-type,
        power, opening-hours, cursor, and optional near-me filters as the full
        charger list. Each returned charger contains only its display name and
        the coordinates of its attached hub; chargers have no independent
        coordinate fields. Location searches are bounded and omit a
        continuation cursor.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
        - name: q
          in: query
          schema: {type: string, maxLength: 255}
          description: Case-insensitive charger, vendor, model, hub, or address search.
        - name: connector_type
          in: query
          schema: {type: string, maxLength: 50}
        - name: min_power_kw
          in: query
          schema: {type: number, minimum: 0}
        - name: max_power_kw
          in: query
          schema: {type: number, minimum: 0}
        - name: open_24_hours
          in: query
          schema: {type: boolean}
        - name: lat
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
          description: Current customer latitude; required together with lng for near-me search.
        - name: lng
          in: query
          schema: {type: number, minimum: -180, maximum: 180}
        - name: radius_km
          in: query
          schema: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 100}
          description: Must be greater than zero; defaults to 10 km.
      responses:
        "200":
          description: Published charger map locations matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerChargerLocationListResponse"
        "400":
          description: Invalid filter, location, power range, limit, or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/chargers/{charger_id}/price:
    get:
      tags: [App User Network]
      operationId: getCustomerChargerPrice
      summary: Get the current informational charger price
      description: "Uses the public charger ID and the same server-side precedence: matching UserGroup tariff, then generic charger tariff, then generic hub tariff."
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "200":
          description: Current price state for the attached charger.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerPriceResponse"}
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: "`charger_not_found` for unknown, unpublished, unassigned, or cross-CPO charger."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/wallet:
    get:
      tags: [App User Wallet]
      operationId: getCustomerWallet
      summary: Get the current customer wallet
      description: Returns the wallet owned by the authenticated CPO-local customer, including the current CPO minimum/buffer policy, balance usable for a new charging hold, and the threshold-only recharge shortfall. Monetary values are exact decimal strings.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200":
          description: Current wallet balance and CPO charging-admission policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerWalletResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Customer wallet invariant is missing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/wallet/transactions:
    get:
      tags: [App User Wallet]
      operationId: listCustomerWalletTransactions
      summary: List the current customer wallet history
      description: Returns only wallet transactions for the authenticated CPO-local customer using bounded descending keyset pagination, plus the same current wallet/CPO admission-policy projection as `GET /wallet`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: Wallet summary and transaction history.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerWalletTransactionListResponse"}
        "400":
          description: Invalid limit or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Customer wallet invariant is missing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/wallet/recharge/orders:
    post:
      tags: [App User Wallet]
      operationId: createCustomerWalletRechargeOrder
      summary: Create a Razorpay wallet recharge order
      description: |
        Creates one CPO/customer-scoped Razorpay order for the exact INR
        amount. The server resolves encrypted CPO credentials internally,
        stores the provider order snapshot, and returns only the public key ID
        needed by the frontend checkout. The Idempotency-Key must be reused
        for a retried request with the same amount. An expired CPO
        subscription, including a current period that has elapsed before the
        lifecycle worker projects `EXPIRED`, rejects only a new order. A
        pre-expiry order remains verifiable.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRechargeOrderRequest"
      responses:
        "201":
          description: Provider order created or the existing idempotent order returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRechargeOrderResponse"
        "400":
          description: Invalid amount, idempotency key, or JSON body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch`, wrong session plane, or `cpo_subscription_expired` when a new recharge order is commercially blocked."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: Idempotency conflict, pending order, or unsupported wallet currency.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "502":
          description: Razorpay order creation failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Razorpay credentials are not configured or unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /api/v1/app/wallet/recharge/verify:
    post:
      tags: [App User Wallet]
      operationId: verifyCustomerWalletRecharge
      summary: Verify and credit a captured Razorpay recharge
      description: |
        Verifies the Razorpay checkout signature, fetches the provider payment
        through the SDK, requires a captured payment matching the stored order,
        and atomically records the provider payment, wallet credit, and
        completed recharge order. Repeated verification is idempotent.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRechargeVerifyRequest"
      responses:
        "200":
          description: Recharge verified and wallet credited, or existing completed result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRechargeOrderResponse"
        "400":
          description: Invalid request or payment signature.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Recharge order is not owned by the current customer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: Payment mismatch, already-completed order, or uncaptured payment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "502":
          description: Razorpay verification fetch failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Razorpay credentials are not configured or unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}

  /api/v1/app/favorites:
    get:
      tags: [App User Network]
      operationId: listCustomerFavorites
      summary: List the current customer's published favorites
      description: |
        Returns customer-owned hub and charger favorites using safe published
        network projections. A hub or charger unpublished after it was saved is
        omitted rather than leaked. Hub and charger collections have separate
        bounded keyset cursors because their durable favorite rows are separate.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: hub_before
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: hub_before_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: charger_before
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: charger_before_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Current customer's visible favorite projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerFavoritesResponse"
        "400":
          description: Invalid limit, cursor, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/favorite-hubs/{hub_id}:
    put:
      tags: [App User Network]
      operationId: addCustomerFavoriteHub
      summary: Save a published hub as a customer favorite
      description: Idempotently saves a hub only when it is published in the current customer CPO.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/HubID"
      responses:
        "204": {description: Favorite saved or already present.}
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404":
          description: "`hub_not_found` for unknown, unpublished, or cross-CPO hub."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      tags: [App User Network]
      operationId: removeCustomerFavoriteHub
      summary: Remove a customer hub favorite
      description: Idempotently removes the current customer's hub favorite; an absent or cross-CPO resource is not enumerated.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/HubID"
      responses:
        "204": {description: Favorite removed or already absent.}
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/favorite-chargers/{charger_id}:
    put:
      tags: [App User Network]
      operationId: addCustomerFavoriteCharger
      summary: Save a published charger as a customer favorite
      description: Uses `CustomerCharger.charger_id`, the public six-character charger ID, not the internal UUID `CustomerCharger.id`; requires attachment to a published hub in the current customer CPO.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "204": {description: Favorite saved or already present.}
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "404":
          description: "`charger_not_found` for unknown, unpublished, unassigned, or cross-CPO charger."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      tags: [App User Network]
      operationId: removeCustomerFavoriteCharger
      summary: Remove a customer charger favorite
      description: Uses `CustomerCharger.charger_id`, the public six-character charger ID, not the internal UUID `CustomerCharger.id`; is idempotent without cross-CPO enumeration.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "204": {description: Favorite removed or already absent.}
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/auth/sessions:
    get:
      tags: [App User Authentication]
      operationId: listCustomerSessions
      summary: List active sessions for this CPO customer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200":
          description: Only sessions for the current customer and CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionListResponse"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/sessions/{session_id}:
    delete:
      tags: [App User Authentication]
      operationId: revokeCustomerSession
      summary: Revoke an owned session for this CPO customer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session and unused refresh token revoked.
        "400":
          description: Missing app ID or invalid session UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          description: Session absent or belongs to another customer/CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/logout:
    post:
      tags: [App User Authentication]
      operationId: logoutCustomerSession
      summary: Revoke the current customer session
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "204":
          description: Current customer session revoked.
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/logout-all:
    post:
      tags: [App User Authentication]
      operationId: logoutAllCustomerSessions
      summary: Revoke every session for this customer in this CPO
      description: Administrative and other-CPO customer sessions are not revoked.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "204":
          description: All sessions for the current CPO customer revoked.
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/change:
    post:
      tags: [App User Authentication]
      operationId: changeCustomerPassword
      summary: Change this CPO-local customer password
      description: Success revokes every session and invalidates outstanding auth challenges for only this CPO customer account.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and every session for this CPO customer revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid JSON, password policy, or reused password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid session or incorrect current password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: startAdministrativeLogin
      summary: Validate password and start an email-OTP challenge
      description: |
        Starts either a platform or a single-CPO administrative login. Platform
        login must omit `cpo_id`; CPO login must include a non-zero `cpo_id`.
        Invalid email, password, scope, identity state, platform authority,
        membership, CPO status, and lockout all collapse to
        `invalid_credentials` to avoid authority enumeration.

        A successful response means the encrypted OTP mail job and challenge
        were committed. It does not mean the provider has delivered the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PlatformLoginRequest"
                - $ref: "#/components/schemas/CPOLoginRequest"
            examples:
              platform:
                value:
                  email: superadmin@example.com
                  password: ExampleOnly-Change-Me
                  scope: PLATFORM
              cpo:
                value:
                  email: admin@example.com
                  password: ExampleOnly-Change-Me
                  scope: CPO
                  cpo_id: c821a013-5041-42f7-80c8-aa153cf9d455
      responses:
        "202":
          description: OTP challenge created and mail queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — credentials or requested authority are invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/2fa/verify:
    post:
      tags: [Authentication]
      operationId: verifyAdministrativeLoginOTP
      summary: Consume a login OTP and create a session
      description: |
        Verifies a six-digit OTP against an unconsumed, unexpired LOGIN_2FA
        challenge. Revalidates the requested platform/CPO authority inside the
        session-creation transaction. Success consumes the challenge, creates a
        durable session and one-time refresh token, and returns an encrypted
        access token. A temporary-password identity also queues a reminder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
            example:
              challenge_id: 5cef4c95-a1da-448e-bd7c-19d570cd4497
              code: "123456"
      responses:
        "200":
          description: Challenge consumed and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/2fa/resend:
    post:
      tags: [Authentication]
      operationId: resendAdministrativeLoginOTP
      summary: Replace an eligible login challenge
      description: |
        Replaces an unconsumed, unexpired LOGIN_2FA challenge after its resend
        cooldown. The previous challenge is invalidated transactionally and a
        new encrypted mail job is queued. The old OTP becomes unusable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Previous challenge invalidated and replacement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: rotateRefreshToken
      summary: Rotate a refresh token and issue a new access token
      description: |
        Accepts the current opaque refresh token once. Success stores a
        replacement, marks the submitted token used, updates safe client
        metadata, revalidates identity/session/authority/CPO state, and returns
        the replacement. Reuse of a consumed token revokes the whole session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_refresh_token` — token invalid, expired, revoked, reused, or authority changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: startPasswordRecovery
      summary: Request a password-reset OTP
      description: |
        Always returns the same accepted response for malformed, unknown, and
        eligible emails, except for operational mail/rate-limit failures.
        Eligible active identities receive a PASSWORD_RESET challenge and
        encrypted outbox job. The response omits challenge material for
        enumeration safety; the eligible recipient's email contains the
        recovery ID, code, and expiry required by reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Enumeration-safe recovery acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: If the account is eligible, a password reset code will be sent.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Consume a recovery OTP and replace the password
      description: |
        Validates and consumes a PASSWORD_RESET challenge, stores a new Argon2id
        password hash, clears login lockout and temporary-password state, and
        revokes every session and refresh token for the identity. The user must
        sign in again. The caller supplies the recovery ID and code delivered
        together to the eligible recipient by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Password reset. Sign in again.
        "400":
          description: "`invalid_request` or `invalid_password`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      summary: Get the current identity and selected authority
      description: |
        Returns global user metadata and the authority selected by this session.
        CPO sessions include CPO ID, role, current app ID, and app-ID mode;
        platform sessions omit those tenant fields.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current validated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the identity's active unexpired sessions
      description: |
        Returns active platform and CPO sessions for the current global
        identity, newest first. `is_current` identifies the bearer session.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Authentication]
      operationId: revokeSession
      summary: Revoke one session owned by the current identity
      description: |
        Revokes the selected session and all of its unused refresh tokens. The
        target may be the current session. A session belonging to another user
        is returned as not found.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session revoked. No response body.
        "400":
          description: "`invalid_request` for a malformed path UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`session_not_found` — no session owned by this identity."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Revoke the current session
      description: Revokes the bearer session and all its unused refresh tokens.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Current session revoked. No response body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllSessions
      summary: Revoke every session for the current identity
      description: |
        Revokes every active platform and CPO session and every unused refresh
        token belonging to the current global identity.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: All sessions revoked. No response body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated identity's password
      description: |
        Requires the current password. The new password must contain 10 to 128
        characters and differ from the current request value. Success clears
        temporary-password state and revokes all sessions, including the one
        used for this request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and all sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Password changed. All sessions were revoked; sign in again.
        "400":
          description: "`invalid_request`, `invalid_password`, or `password_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "`unauthorized` or `invalid_current_password`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/events:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: listPlatformEvents
      summary: Recover durable platform events after a cursor
      description: |
        Returns unexpired committed platform events in ascending ID order.
        Delivery is at least once; clients deduplicate using the numeric event
        ID and refresh authoritative REST resources after receiving an event.
      security:
        - BearerAuth: []
      parameters:
        - name: after_id
          in: query
          description: Last processed event ID. Zero starts at the earliest retained event.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: type
          in: query
          description: Optional exact event-type filter.
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Ordered retained event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventPage"
        "400":
          description: "`invalid_after_id` or `invalid_limit`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`realtime_cursor_expired` — refresh platform REST state before reconnecting."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/realtime/stream:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: streamPlatformEvents
      summary: Stream durable platform events using SSE
      description: |
        Authenticated server-sent event stream for PLATFORM sessions. The
        bearer token must be sent in the Authorization header, so browser
        clients use fetch streaming rather than placing a token in the URL.
        `Last-Event-ID` or `after_id` resumes committed events. Heartbeats
        revalidate the durable session and the stream closes after revocation.
      security:
        - BearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last processed numeric event ID.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: after_id
          in: query
          description: Cursor fallback when Last-Event-ID is absent.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: type
          in: query
          description: Optional exact event-type filter.
          schema:
            type: string
            maxLength: 150
        - name: limit
          in: query
          description: Initial retained-event replay batch size.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: |
            `text/event-stream` containing `id`, `event`, and one-line JSON
            `data` fields plus heartbeat comments.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 14582
                event: platform.cpo.suspended
                data: {"id":14582,"type":"platform.cpo.suspended","resource_type":"CPO","resource_id":"c821a013-5041-42f7-80c8-aa153cf9d455","data":{"previous_status":"ACTIVE","status":"SUSPENDED","reason":"Access paused at operator request"},"occurred_at":"2026-07-24T12:14:52Z"}

        "400":
          description: "`invalid_after_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`realtime_cursor_expired` before streaming begins."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/audit-logs:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: listPlatformAuditLogs
      summary: Query privileged audit records
      description: |
        Returns newest-first immutable audit records. Details are structured
        operational metadata and must never contain credentials, OTPs, tokens,
        or decrypted mail payloads.
      security:
        - BearerAuth: []
      parameters:
        - name: before
          in: query
          description: |
            RFC3339 created-at component of the exclusive cursor. When the
            preceding response returns `next_before_id`, send both values.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: |
            UUID tie-breaker paired with `before`. It is invalid without
            `before` and prevents records with identical timestamps being
            skipped.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: entity
          in: query
          schema:
            type: string
            maxLength: 100
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cpo_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Newest-first audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          description: Invalid timestamp, UUID, or limit filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/workers:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: listPlatformWorkers
      summary: List current logical-worker health
      description: |
        Reports one current process incarnation for each logical worker from
        durable heartbeats. Historical instances are retained but omitted.
        STALE is derived when the current heartbeat exceeds
        PLATFORM_WORKER_STALE_AFTER. This endpoint cannot start, stop, or kill
        worker processes.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current logical-worker instances and derived health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/hal-facts/{fact_id}/requeue:
    post:
      tags: [Superadmin - Platform Operations]
      operationId: requeueHALFact
      summary: Requeue one HAL fact awaiting receiver reconciliation
      description: |
        Requests HAL to requeue exactly one immutable fact that is currently
        `RECONCILIATION_REQUIRED`. This does not create, alter, or replay a
        different fact. Platform audit evidence records the requested and
        resulting outcome; the server-generated request ID is the HAL
        correlation ID.
      security:
        - BearerAuth: []
      parameters:
        - name: fact_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: HAL accepted the exact immutable fact for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [fact_id, status]
                properties:
                  fact_id: {type: string, format: uuid}
                  status: {type: string, enum: [PENDING]}
        "400": {description: Invalid fact identity.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: HAL has no fact with this exact identity.}
        "409": {description: The fact is not awaiting reconciliation.}
        "502": {description: HAL could not complete the requeue request.}
        "503": {description: HAL recovery is not configured.}
        "500": {$ref: "#/components/responses/InternalError"}

