        "200":
          description: The requested customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOCustomer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`customer_not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/admin/profile:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOAdminProfile
      summary: Read the authenticated CPO administrator profile
      description: |
        Returns the global login identity fields used by the current CPO ADMIN
        session, including optional phone. `/api/v1/auth/me` remains the
        canonical authentication/bootstrap response. This route does not return
        or edit the CPO organization record.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current administrator identity profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations - Account & Notifications]
      operationId: updateCPOAdminProfile
      summary: Update the authenticated administrator name or phone
      description: |
        Updates the global identity used by this ADMIN session and writes
        `CPO_ADMIN_PROFILE_UPDATED` audit evidence. Email and role are
        immutable here. A blank phone clears it; blank full name is invalid.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOAdminProfileRequest"
      responses:
        "200":
          description: Updated administrator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          description: Invalid body, profile field, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/users/{user_id}:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCPOUser
      summary: Read one staff identity registered to the authenticated CPO
      description: |
        Returns basic identity and membership fields only when the user has a
        staff membership in the trusted CPO. Customer accounts are separate and
        cannot be read here. This is a point lookup, not a staff directory; the caller cannot
        select another tenant and an unlinked ID receives the same not-found
        response as an unknown ID.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: UUID of the user to read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details for the authenticated CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOUser"
        "400":
          description: "`invalid_user_id` or missing app-ID header."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`user_not_found` — the user is not registered to this CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/settings:
    get:
      tags: [CPO Operations - Account & Notifications]
      operationId: getCpoSettings
      summary: Get the CPO's settings
      description: |
        Returns the settings for the authenticated CPO. Every CPO has a
        blank, zero-default settings row created during provisioning. The CPO ID is
