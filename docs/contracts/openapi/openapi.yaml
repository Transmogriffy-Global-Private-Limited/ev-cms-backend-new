          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/operations/fleet:
    get:
      tags: [CPO Operations - Live]
      operationId: getCPOFleetOperations
      summary: Read the current CMS-projected operational fleet summary
      description: Reads durable CMS runtime projections only; it never synchronously calls HAL.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200": {description: Current fleet projection, content: {application/json: {schema: {$ref: "#/components/schemas/FleetOperationsResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/CPOBusinessForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/cpo/operations/chargers/{charger_id}:
    get:
      tags: [CPO Operations - Live]
      operationId: getCPOOperationalCharger
      summary: Read administrative inventory with CMS-projected live state
      description: Administrative state and HAL-derived runtime state remain separate. REST is the recovery authority.
      security: [{BearerAuth: [], CPOAppID: []}]
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
