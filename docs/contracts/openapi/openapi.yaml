openapi: 3.1.0
info:
  title: TransEV EV CMS API
  version: 0.10.0
  description: |
    Canonical machine-readable contract for the endpoints currently implemented
    by `ev-cms-backend-new`.

    Authentication uses a signed-then-encrypted bearer access token. Platform
    sessions and CPO sessions are separate. CPO integration operations also
    require `X-CPO-App-ID`; that header is checked only after the bearer token
    establishes the CPO and never selects a tenant.

    Public customer signup requires `X-CPO-App-ID` to resolve an active CPO, but
    the header remains public routing metadata rather than authentication.
    Administrative authentication, platform control-plane, health, and
    documentation routes do not require it. Request bodies reject unknown
    properties and are limited to 32 KiB by the server.
  contact:
    name: TransEV Engineering
servers:
  - url: /
    description: Same origin as the API documentation page
tags:
  - name: Health
    description: Process liveness and PostgreSQL readiness.
  - name: Authentication
    description: Password, email OTP, token, password, and session operations.
  - name: App User Authentication
    description: Public signup and complete customer credential/session operations.
  - name: Platform CPOs
    description: Platform-superadmin CPO provisioning and lifecycle control.
  - name: Platform Operations
    description: Durable audit, event recovery, worker health, and realtime operations.
  - name: CPO Operations
    description: Tenant-scoped profile, charging-network inventory, tax, and tariff operations.
  - name: CPO Integrations
    description: CPO owner/admin write-only integration credential management.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      description: |
        Returns success when the HTTP process is running. It does not query
        PostgreSQL and must not be used as a database-readiness signal.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check PostgreSQL readiness
      description: Queries PostgreSQL with a two-second timeout.
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: PostgreSQL is absent, unavailable, or did not respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not_ready

  /api/v1/app/auth/signup:
    post:
      tags: [App User Authentication]
      operationId: startCustomerSignup
      summary: Start CPO-scoped customer signup
      description: |
        Resolves an active CPO from its current app ID, validates the proposed
        profile and password, stores only an Argon2id password hash, and queues
        an encrypted email-OTP job. No identity or customer exists yet.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSignupRequest"
      responses:
        "202":
          description: Durable signup challenge and mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Invalid JSON, app-ID header, email, password, name, or phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`signup_unavailable` — app ID does not resolve an active CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/signup/verify:
    post:
      tags: [App User Authentication]
      operationId: verifyCustomerSignup
      summary: Verify email and create the CPO customer
      description: |
        Verifies and consumes the CPO-bound OTP. In one transaction it creates
        a global identity or safely reuses an active one, creates the
        CPO-scoped customer and zero-balance INR wallet, and records an audit
        event. Existing identity credentials and profile are never overwritten.
        This endpoint does not issue customer login tokens.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
      responses:
        "201":
          description: Customer and wallet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSignupResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "403":
          description: "`signup_unavailable` — CPO or existing identity is inactive."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`customer_already_registered` — verified identity is already this CPO's customer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/signup/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerSignupOTP
      summary: Replace an eligible signup challenge
      description: |
        After the cooldown, invalidates an unconsumed challenge and creates a
        replacement carrying the same password hash and proposed profile. CPO
        app identity and active lifecycle are revalidated.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement challenge and mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login:
    post:
      tags: [App User Authentication]
      operationId: startCustomerLogin
      summary: Validate a customer password and start mail OTP
      description: |
        Resolves the active CPO by app ID, validates the global password and an
        active customer relationship, then durably queues a customer login OTP.
        Invalid identity, password, customer membership, lockout, and customer
        status collapse to `invalid_credentials`.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
      responses:
        "202":
          description: Customer login challenge and encrypted mail job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — credentials or customer authority are invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`signup_unavailable` — app ID does not resolve an active CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login/verify:
    post:
      tags: [App User Authentication]
      operationId: verifyCustomerLogin
      summary: Verify customer login OTP and create a session
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
      responses:
        "200":
          description: Customer session and rotating refresh lineage created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/login/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerLoginOTP
      summary: Replace an eligible customer login challenge
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement customer login challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/refresh:
    post:
      tags: [App User Authentication]
      operationId: rotateCustomerRefreshToken
      summary: Rotate a customer refresh token
      description: |
        Accepts the current opaque token once, revalidates user, customer, CPO,
        session, and app-ID state, and atomically returns a replacement.
        Consumed-token reuse revokes the complete customer session.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Customer refresh token rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_refresh_token` — invalid, expired, revoked, reused, or no longer authorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/forgot:
    post:
      tags: [App User Authentication]
      operationId: startCustomerPasswordRecovery
      summary: Start enumeration-safe customer password recovery
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Generic response whether or not an eligible customer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: App ID does not resolve an active CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/reset/resend:
    post:
      tags: [App User Authentication]
      operationId: resendCustomerPasswordResetOTP
      summary: Replace an eligible customer password-reset challenge
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Replacement password-reset challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/reset:
    post:
      tags: [App User Authentication]
      operationId: resetCustomerPassword
      summary: Consume a customer reset OTP and replace the global password
      description: Success revokes every session for the global identity.
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and every identity session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request or password policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/me:
    get:
      tags: [App User Authentication]
      operationId: getCurrentCustomer
      summary: Get the current app-user bootstrap payload
      description: |
        Returns the validated global identity, CPO customer relationship, CPO
        application identity, and customer wallet. Backend handlers obtain the
        same trusted IDs through the `customerauth.Current*` helpers.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200":
          description: Current customer application context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMeResponse"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cpo_app_id_mismatch` or wrong session plane."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/sessions:
    get:
      tags: [App User Authentication]
      operationId: listCustomerSessions
      summary: List active sessions for this CPO customer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "200":
          description: Only sessions for the current customer and CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionListResponse"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/sessions/{session_id}:
    delete:
      tags: [App User Authentication]
      operationId: revokeCustomerSession
      summary: Revoke an owned session for this CPO customer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session and unused refresh token revoked.
        "400":
          description: Missing app ID or invalid session UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          description: Session absent or belongs to another customer/CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/logout:
    post:
      tags: [App User Authentication]
      operationId: logoutCustomerSession
      summary: Revoke the current customer session
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "204":
          description: Current customer session revoked.
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/logout-all:
    post:
      tags: [App User Authentication]
      operationId: logoutAllCustomerSessions
      summary: Revoke every session for this customer in this CPO
      description: Administrative and other-CPO customer sessions are not revoked.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      responses:
        "204":
          description: All sessions for the current CPO customer revoked.
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/app/auth/password/change:
    post:
      tags: [App User Authentication]
      operationId: changeCustomerPassword
      summary: Change the global identity password
      description: Success revokes every session for the identity in every plane.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOAppIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and every identity session revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid JSON, password policy, or reused password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid session or incorrect current password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: startAdministrativeLogin
      summary: Validate password and start an email-OTP challenge
      description: |
        Starts either a platform or a single-CPO administrative login. Platform
        login must omit `cpo_id`; CPO login must include a non-zero `cpo_id`.
        Invalid email, password, scope, identity state, platform authority,
        membership, CPO status, and lockout all collapse to
        `invalid_credentials` to avoid authority enumeration.

        A successful response means the encrypted OTP mail job and challenge
        were committed. It does not mean the provider has delivered the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PlatformLoginRequest"
                - $ref: "#/components/schemas/CPOLoginRequest"
            examples:
              platform:
                value:
                  email: superadmin@example.com
                  password: ExampleOnly-Change-Me
                  scope: PLATFORM
              cpo:
                value:
                  email: admin@example.com
                  password: ExampleOnly-Change-Me
                  scope: CPO
                  cpo_id: c821a013-5041-42f7-80c8-aa153cf9d455
      responses:
        "202":
          description: OTP challenge created and mail queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — credentials or requested authority are invalid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/2fa/verify:
    post:
      tags: [Authentication]
      operationId: verifyAdministrativeLoginOTP
      summary: Consume a login OTP and create a session
      description: |
        Verifies a six-digit OTP against an unconsumed, unexpired LOGIN_2FA
        challenge. Revalidates the requested platform/CPO authority inside the
        session-creation transaction. Success consumes the challenge, creates a
        durable session and one-time refresh token, and returns an encrypted
        access token. A temporary-password identity also queues a reminder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationRequest"
            example:
              challenge_id: 5cef4c95-a1da-448e-bd7c-19d570cd4497
              code: "123456"
      responses:
        "200":
          description: Challenge consumed and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/2fa/resend:
    post:
      tags: [Authentication]
      operationId: resendAdministrativeLoginOTP
      summary: Replace an eligible login challenge
      description: |
        Replaces an unconsumed, unexpired LOGIN_2FA challenge after its resend
        cooldown. The previous challenge is invalidated transactionally and a
        new encrypted mail job is queued. The old OTP becomes unusable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResendRequest"
      responses:
        "202":
          description: Previous challenge invalidated and replacement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: rotateRefreshToken
      summary: Rotate a refresh token and issue a new access token
      description: |
        Accepts the current opaque refresh token once. Success stores a
        replacement, marks the submitted token used, updates safe client
        metadata, revalidates identity/session/authority/CPO state, and returns
        the replacement. Reuse of a consumed token revokes the whole session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_refresh_token` — token invalid, expired, revoked, reused, or authority changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: startPasswordRecovery
      summary: Request a password-reset OTP
      description: |
        Always returns the same accepted response for malformed, unknown, and
        eligible emails, except for operational mail/rate-limit failures.
        Eligible active identities receive a PASSWORD_RESET challenge and
        encrypted outbox job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Enumeration-safe recovery acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: If the account is eligible, a password reset code will be sent.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Consume a recovery OTP and replace the password
      description: |
        Validates and consumes a PASSWORD_RESET challenge, stores a new Argon2id
        password hash, clears login lockout and temporary-password state, and
        revokes every session and refresh token for the identity. The user must
        sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Password reset. Sign in again.
        "400":
          description: "`invalid_request` or `invalid_password`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      summary: Get the current identity and selected authority
      description: |
        Returns global user metadata and the authority selected by this session.
        CPO sessions include CPO ID, role, current app ID, and app-ID mode;
        platform sessions omit those tenant fields.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current validated principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: List the identity's active unexpired sessions
      description: |
        Returns active platform and CPO sessions for the current global
        identity, newest first. `is_current` identifies the bearer session.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Authentication]
      operationId: revokeSession
      summary: Revoke one session owned by the current identity
      description: |
        Revokes the selected session and all of its unused refresh tokens. The
        target may be the current session. A session belonging to another user
        is returned as not found.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session revoked. No response body.
        "400":
          description: "`invalid_request` for a malformed path UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`session_not_found` — no session owned by this identity."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Revoke the current session
      description: Revokes the bearer session and all its unused refresh tokens.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Current session revoked. No response body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllSessions
      summary: Revoke every session for the current identity
      description: |
        Revokes every active platform and CPO session and every unused refresh
        token belonging to the current global identity.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: All sessions revoked. No response body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated identity's password
      description: |
        Requires the current password. The new password must contain 10 to 128
        characters and differ from the current request value. Success clears
        temporary-password state and revokes all sessions, including the one
        used for this request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and all sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: Password changed. All sessions were revoked; sign in again.
        "400":
          description: "`invalid_request`, `invalid_password`, or `password_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "`unauthorized` or `invalid_current_password`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/events:
    get:
      tags: [Platform Operations]
      operationId: listPlatformEvents
      summary: Recover durable platform events after a cursor
      description: |
        Returns unexpired committed platform events in ascending ID order.
        Delivery is at least once; clients deduplicate using the numeric event
        ID and refresh authoritative REST resources after receiving an event.
      security:
        - BearerAuth: []
      parameters:
        - name: after_id
          in: query
          description: Last processed event ID. Zero starts at the earliest retained event.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: type
          in: query
          description: Optional exact event-type filter.
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Ordered retained event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformEventPage"
        "400":
          description: "`invalid_after_id` or `invalid_limit`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`realtime_cursor_expired` — refresh platform REST state before reconnecting."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/realtime/stream:
    get:
      tags: [Platform Operations]
      operationId: streamPlatformEvents
      summary: Stream durable platform events using SSE
      description: |
        Authenticated server-sent event stream for PLATFORM sessions. The
        bearer token must be sent in the Authorization header, so browser
        clients use fetch streaming rather than placing a token in the URL.
        `Last-Event-ID` or `after_id` resumes committed events. Heartbeats
        revalidate the durable session and the stream closes after revocation.
      security:
        - BearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last processed numeric event ID.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: after_id
          in: query
          description: Cursor fallback when Last-Event-ID is absent.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: type
          in: query
          description: Optional exact event-type filter.
          schema:
            type: string
            maxLength: 150
        - name: limit
          in: query
          description: Initial retained-event replay batch size.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: |
            `text/event-stream` containing `id`, `event`, and one-line JSON
            `data` fields plus heartbeat comments.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 14582
                event: platform.worker.status_changed
                data: {"id":14582,"type":"platform.worker.status_changed","resource_type":"WORKER","resource_id":"mail-outbox","data":{"status":"STALE"},"occurred_at":"2026-07-24T12:14:52Z"}

        "400":
          description: "`invalid_after_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`realtime_cursor_expired` before streaming begins."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/audit-logs:
    get:
      tags: [Platform Operations]
      operationId: listPlatformAuditLogs
      summary: Query privileged audit records
      description: |
        Returns newest-first immutable audit records. Details are structured
        operational metadata and must never contain credentials, OTPs, tokens,
        or decrypted mail payloads.
      security:
        - BearerAuth: []
      parameters:
        - name: before
          in: query
          description: |
            RFC3339 created-at component of the exclusive cursor. When the
            preceding response returns `next_before_id`, send both values.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: |
            UUID tie-breaker paired with `before`. It is invalid without
            `before` and prevents records with identical timestamps being
            skipped.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: entity
          in: query
          schema:
            type: string
            maxLength: 100
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cpo_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Newest-first audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          description: Invalid timestamp, UUID, or limit filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/workers:
    get:
      tags: [Platform Operations]
      operationId: listPlatformWorkers
      summary: List durable worker health
      description: |
        Reports worker instances from durable heartbeats. STALE is derived when
        the latest heartbeat exceeds PLATFORM_WORKER_STALE_AFTER. This endpoint
        cannot start, stop, or kill worker processes.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Worker instances and derived health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos:
    post:
      tags: [Platform CPOs]
      operationId: createCPO
      summary: Create a pending CPO and its first administrator
      description: |
        Atomically creates a pending CPO with no commercial prerequisite, a
        unique dummy app ID, an ADMIN membership, audit data, and an encrypted
        onboarding mail job. A new email receives a generated temporary
        password; an existing active identity keeps its password. The
        temporary password never appears in the response.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCPORequest"
      responses:
        "201":
          description: CPO and first administrator created or attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCPOResponse"
        "400":
          description: |
            `invalid_request`, `invalid_slug`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, `invalid_profile`,
            `invalid_admin_email`, or `invalid_admin_full_name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`cpo_conflict` or `admin_identity_inactive`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Platform CPOs]
      operationId: listCPOs
      summary: Search and cursor-page CPOs
      description: |
        Returns a stable newest-first page. Search matches business name, slug,
        GSTIN, app ID, and the designated primary administrator's name/email.
        When `has_more` is true, send both returned cursor fields unchanged.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, SUSPENDED]
        - name: app_id_mode
          in: query
          schema:
            $ref: "#/components/schemas/CPOAppIDMode"
        - name: before
          in: query
          description: Exclusive RFC3339 creation-time cursor; requires before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: Exclusive UUID tie-breaker; requires before.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: CPO collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOListResponse"
        "400":
          description: |
            `invalid_q`, `invalid_status`, `invalid_app_id_mode`,
            `invalid_before`, `invalid_before_id`, `invalid_cursor`, or
            `invalid_limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}:
    get:
      tags: [Platform CPOs]
      operationId: getCPO
      summary: Get one CPO
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/profile:
    put:
      tags: [Platform CPOs]
      operationId: updateCPOProfile
      summary: Replace the mutable CPO business profile
      description: |
        Replaces business-profile fields in one transaction and emits audit and
        realtime evidence. The stable slug, lifecycle, app ID, and tenant data
        are not changed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOProfileRequest"
      responses:
        "200":
          description: Updated CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, or `invalid_profile`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_conflict` — GSTIN is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/activate:
    post:
      tags: [Platform CPOs]
      operationId: activateCPO
      summary: Set a CPO active
      description: |
        Idempotently grants platform access by setting the CPO lifecycle status
        to ACTIVE. A live app ID is not required. CPO administrative login
        becomes eligible.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current active CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/suspend:
    post:
      tags: [Platform CPOs]
      operationId: suspendCPO
      summary: Suspend a CPO and revoke its sessions
      description: |
        Idempotently sets status to SUSPENDED and revokes every active CPO-staff
        and customer session plus unused refresh tokens for the tenant. New
        tenant login is blocked. Platform sessions are unaffected.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current suspended CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/app-id:
    put:
      tags: [Platform CPOs]
      operationId: setLiveCPOAppID
      summary: Assign or rotate the live CPO app ID
      description: |
        Normalizes the supplied value to lowercase and replaces the current
        dummy or live ID immediately. Existing sessions stay valid, but tenant
        business requests must use the new header value. The reserved
        `cpo_dummy_` prefix is forbidden.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCPOAppIDRequest"
      responses:
        "200":
          description: CPO with current LIVE app identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_cpo_app_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_conflict` — app ID is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin:
    get:
      tags: [Platform CPOs]
      operationId: getCPOPrimaryAdmin
      summary: Get the designated primary administrator
      description: |
        Returns identity/membership state and only safe metadata for the latest
        correlated onboarding mail. Mail ciphertext and delivery errors are not
        exposed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: Current primary administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Platform CPOs]
      operationId: setCPOPrimaryAdmin
      summary: Restore or replace the primary administrator
      description: |
        Serializes changes per CPO and normalized email. An existing active
        identity keeps its password. A new identity receives a generated
        temporary password only through encrypted onboarding mail. Replacing
        the administrator revokes the previous administrator's CPO sessions
        and membership in the same transaction. Repeating the already-active
        assignment is a side-effect-free success.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrimaryAdminRequest"
      responses:
        "200":
          description: Current primary administrator after the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_email`,
            `invalid_full_name`, or `invalid_reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`admin_identity_inactive` or `cpo_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin/resend-onboarding:
    post:
      tags: [Platform CPOs]
      operationId: resendCPOPrimaryAdminOnboarding
      summary: Queue a credential-free onboarding recovery email
      description: |
        Queues an encrypted mail containing current CPO/app details and directs
        the active primary administrator to normal password recovery. Existing
        or generated passwords are never sent by this operation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "202":
          description: Mail queued; response contains the resulting safe metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
