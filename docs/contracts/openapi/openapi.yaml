          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — a requested charger was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`hub_conflict` or `charger_already_in_hub`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations]
      operationId: listCPOHubs
      summary: List tenant hubs
      description: Requires CPO ADMIN and uses stable descending keyset pagination.
      security:
        - BearerAuth: []
