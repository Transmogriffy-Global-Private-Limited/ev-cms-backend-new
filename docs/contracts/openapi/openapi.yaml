        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [CPO Operations - Account & Notifications]
      operationId: updateCpoSettings
      summary: Update the CPO's settings
      description: |
        Updates the settings for the authenticated CPO.
      security:
        - BearerAuth: []
        - CPOAppID: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateOrUpdateCpoSettingsMultipartRequest"
            encoding:
              invoice_logo:
                contentType: image/*
      responses:
        "200":
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCpoSettingsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cpo/settings/invoice-logo:
    get:
