        state: {type: string, minLength: 1, maxLength: 100}
        pincode: {type: string, minLength: 1, maxLength: 10}
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED]
        status_changed_at: {type: string, format: date-time}
        app_id:
          type: string
          description: Current non-secret application identifier required in CPO request headers.
        app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"
        app_id_updated_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    DecimalInput:
      description: |
        Exact base-10 decimal. JSON strings are recommended so clients do not
        introduce binary floating-point rounding; JSON numbers are also accepted.
      oneOf:
        - type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
        - type: number

    ExactDecimal:
      type: string
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
      description: Exact base-10 decimal serialized as a JSON string.

    CreateConnectorRequest:
      type: object
      additionalProperties: false
      required: [connector_number, connector_type, connector_total_capacity]
      properties:
        connector_number:
          type: integer
          minimum: 1
        connector_type:
          type: string
          minLength: 1
          maxLength: 50
          example: CCS2
        connector_total_capacity:
          type: number
          minimum: 0
          default: 0

    CreateChargerRequest:
      type: object
      additionalProperties: false
      required: [serial_number, connectors, charger_name, charger_host_name, charger_host_phone_no, charger_type, segment, sub_segment, charger_use_type, number_of_connectors, parking, protocol, twenty_four_seven_open_status]
      properties:
        hub_id:
          type: string
          format: uuid
          nullable: true
          description: Optional same-CPO hub. Omit to create an independent, unassigned charger.
        vendor:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
        max_power_kw:
          type: number
          minimum: 0
          default: 0
        charger_name:
          type: string
          maxLength: 255
        charger_host_name:
          type: string
          maxLength: 255
        charger_host_phone_no:
          type: string
          maxLength: 20
        charger_type:
          type: string
          maxLength: 100
        segment:
          type: string
          maxLength: 100
        sub_segment:
          type: string
          maxLength: 100
        charger_use_type:
          type: string
          maxLength: 100
        number_of_connectors:
          type: integer
          minimum: 1
        parking:
          type: string
          maxLength: 100
        protocol:
          type: string
          maxLength: 50
        twenty_four_seven_open_status:
          type: boolean
        connectors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateConnectorRequest"
      example:
        vendor: Delta
        model: DC Wallbox
        serial_number: SN-001
        max_power_kw: 25
        charger_name: "My Charger"
        charger_host_name: "Host Name"
        charger_host_phone_no: "1234567890"
        charger_type: "DC"
        segment: "Public"
        sub_segment: "Highway"
        charger_use_type: "Commercial"
        number_of_connectors: 1
        parking: "Paid"
        protocol: "OCPP 1.6J"
        twenty_four_seven_open_status: true
        connectors:
          - connector_number: 1
            connector_type: CCS2
            connector_total_capacity: 22.5

    UpdateConnectorRequest:
      type: object
      additionalProperties: false
      required: [id]
      minProperties: 2
      properties:
        id:
          type: string
          format: uuid
        connector_number:
          type: integer
          minimum: 1
        connector_type:
          type: string
          minLength: 1
          maxLength: 50
        connector_total_capacity:
          type: number
          minimum: 0
    UpdateChargerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        hub_id:
          type: string
          format: uuid
          description: Assigns or reassigns the charger to this same-CPO hub. Explicit unassignment is not supported.
        vendor:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
        max_power_kw:
          type: number
          minimum: 0
        charger_name:
          type: string
          maxLength: 255
        charger_host_name:
          type: string
          maxLength: 255
        charger_host_phone_no:
          type: string
          maxLength: 20
        charger_type:
          type: string
          maxLength: 100
        segment:
          type: string
          maxLength: 100
        sub_segment:
          type: string
          maxLength: 100
        charger_use_type:
          type: string
          maxLength: 100
        number_of_connectors:
          type: integer
          minimum: 1
        parking:
          type: string
          maxLength: 100
        protocol:
          type: string
          maxLength: 50
        twenty_four_seven_open_status:
          type: boolean
        connectors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UpdateConnectorRequest"

    Connector:
      type: object
      additionalProperties: false
      required:
        - id
        - cpo_id
        - charger_id
        - connector_number
        - connector_type
        - connector_total_capacity
        - status
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        charger_id: {type: string, format: uuid}
        connector_number: {type: integer, minimum: 1}
        connector_type: {type: string, maxLength: 50}
        connector_total_capacity:
          type: number
          minimum: 0
        status:
          $ref: "#/components/schemas/ChargerStatus"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Charger:
      type: object
      additionalProperties: false
      required:
        - id
        - cpo_id
        - charger_id
        - ocpp_identity
        - serial_number
        - max_power_kw
        - status
        - ocpp_version
        - connectors
        - created_at
        - updated_at
        - charger_name
        - charger_host_name
        - charger_host_phone_no
        - charger_type
        - segment
        - sub_segment
        - charger_use_type
        - number_of_connectors
        - parking
        - protocol
        - twenty_four_seven_open_status
        - charger_connection_url_ws
        - charger_connection_url_wss
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        hub_id:
          type: string
          format: uuid
          description: Absent for an independent charger that has not been assigned to a hub.
        charger_id:
          type: string
          pattern: "^[a-z0-9]{6}$"
        ocpp_identity:
          type: string
          maxLength: 255
          description: CMS mapping value; not proof of a live HAL connection.
        vendor: {type: string, maxLength: 100, nullable: true}
        model: {type: string, maxLength: 100, nullable: true}
        serial_number: {type: string, maxLength: 100}
        max_power_kw: {type: number, minimum: 0}
        charger_name:
          type: string
          maxLength: 255
        charger_host_name:
          type: string
          maxLength: 255
        charger_host_phone_no:
          type: string
          maxLength: 20
        charger_type:
          type: string
          maxLength: 100
        segment:
          type: string
          maxLength: 100
        sub_segment:
          type: string
          maxLength: 100
        charger_image:
          type: string
          description: Path to the charger image.
        charger_use_type:
          type: string
          maxLength: 100
        number_of_connectors:
          type: integer
          minimum: 1
        parking:
          type: string
          maxLength: 100
        protocol:
          type: string
          maxLength: 50
        twenty_four_seven_open_status:
          type: boolean
        charger_connection_url_ws:
          type: string
          format: uri
          description: OCPP WebSocket endpoint derived from the configured non-TLS charger host and the generated OCPP identity.
        charger_connection_url_wss:
          type: string
          format: uri
          description: OCPP secure-WebSocket endpoint derived from the configured charger host and the generated OCPP identity.
        email:
          type: string
          format: email
          description: Authenticated CPO administrator email; omitted only when unavailable.
        status:
          $ref: "#/components/schemas/ChargerStatus"
        ocpp_version: {type: string, maxLength: 20}
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ChargerResponse:
      $ref: "#/components/schemas/Charger"

    ChargerListResponse:
      type: object
      additionalProperties: false
      required: [chargers, has_more]
      properties:
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/Charger"
        next_before:
          type: string
          format: date-time
        next_before_id:
          type: string
          format: uuid
        has_more:
          type: boolean

    CreateHubRequest:
      type: object
      additionalProperties: false
      required: [name, address, latitude, longitude]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        address: {type: string, minLength: 1, maxLength: 5000}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        open_24_hours: {type: boolean, default: true}
        sanction_load:
          type: number
          minimum: 0
          description: Site sanctioned electrical capacity in kW. Defaults to 0 when not recorded.
        customer_visible:
          type: boolean
          default: false
          description: Publish this hub to customer network discovery. CPO ADMIN only.
        charger_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Optional list of charger UUIDs to assign to this hub.
      example:
        name: Park Street Hub
        address: 12 Park Street, Kolkata
        latitude: 22.5524
        longitude: 88.3521
        open_24_hours: true
        charger_ids:
          - "c821a013-5041-42f7-80c8-aa153cf9d455"
          - "d48b5329-2399-4448-9354-f252b952cd7a"

    UpdateHubRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        address: {type: string, minLength: 1, maxLength: 5000}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        open_24_hours: {type: boolean}
        sanction_load:
          type: number
          minimum: 0
          description: Site sanctioned electrical capacity in kW.
        customer_visible:
          type: boolean
          description: Publish or unpublish this hub from customer network discovery.

    Hub:
      type: object
      additionalProperties: false
      required:
        [id, cpo_id, name, address, latitude, longitude, open_24_hours, sanction_load, customer_visible, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        name: {type: string}
        address: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        open_24_hours: {type: boolean}
        sanction_load:
          type: number
          minimum: 0
          description: Site sanctioned electrical capacity in kW; 0 means not recorded.
        customer_visible:
          type: boolean
          description: Whether this hub is published to customer network discovery.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    HubResponse:
      type: object
      additionalProperties: false
      required:
        [id, cpo_id, name, address, latitude, longitude, open_24_hours, sanction_load, customer_visible, chargers, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        name: {type: string}
        address: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        open_24_hours: {type: boolean}
        sanction_load:
          type: number
          minimum: 0
          description: Site sanctioned electrical capacity in kW; 0 means not recorded.
        customer_visible:
          type: boolean
          description: Whether this hub is published to customer network discovery.
        chargers:
          $ref: "#/components/schemas/ChargerListResponse"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    HubListResponse:
      type: object
      additionalProperties: false
      required: [hubs, has_more]
      properties:
        hubs:
          type: array
          items:
            $ref: "#/components/schemas/Hub"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CreateGSTRequest:
      type: object
      additionalProperties: false
      required: [name, sgst_rate, cgst_rate, igst_rate]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        sgst_rate:
          allOf:
            - $ref: "#/components/schemas/DecimalInput"
          description: Exact percentage from 0 through 100.
        cgst_rate:
          allOf:
            - $ref: "#/components/schemas/DecimalInput"
          description: Exact percentage from 0 through 100.
        igst_rate:
          allOf:
            - $ref: "#/components/schemas/DecimalInput"
          description: Exact percentage from 0 through 100.
        is_active: {type: boolean, default: true}
      example:
        name: Standard GST
        sgst_rate: "9.00"
        cgst_rate: "9.00"
        igst_rate: "18.00"
        is_active: true

    UpdateGSTRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        sgst_rate: {$ref: "#/components/schemas/DecimalInput"}
        cgst_rate: {$ref: "#/components/schemas/DecimalInput"}
        igst_rate: {$ref: "#/components/schemas/DecimalInput"}
        is_active: {type: boolean}

    GST:
      type: object
      additionalProperties: false
      required:
        [id, cpo_id, name, sgst_rate, cgst_rate, igst_rate, is_active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        name: {type: string}
        sgst_rate: {$ref: "#/components/schemas/ExactDecimal"}
        cgst_rate: {$ref: "#/components/schemas/ExactDecimal"}
        igst_rate: {$ref: "#/components/schemas/ExactDecimal"}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    GSTListResponse:
      type: object
      additionalProperties: false
      required: [gsts, has_more]
      properties:
        gsts:
          type: array
          items:
            $ref: "#/components/schemas/GST"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CreateTariffRequest:
      type: object
      additionalProperties: false
      required: [hub_id, price_per_kwh]
      properties:
        hub_id: {type: string, format: uuid}
        charger_id: {type: string, format: uuid}
        gst_id: {type: string, format: uuid}
        user_group_id: {type: string, format: uuid}
        price_per_kwh:
          $ref: "#/components/schemas/DecimalInput"
        idle_fee_per_min:
          $ref: "#/components/schemas/DecimalInput"
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
          default: INR
        is_active: {type: boolean, default: true}
        start_date:
          type: string
          format: date-time
          description: Must be supplied together with end_date; inclusive.
        end_date:
          type: string
          format: date-time
          description: Must be later than start_date; exclusive.
      example:
        hub_id: 8b80ef78-7799-4a09-a0d5-73ac944aa6e0
        charger_id: 7cc2d481-3ccb-4336-b03c-c8851a59ff9a
        gst_id: 3e38d953-fe0a-4bfa-a11c-356c92bba7e9
        price_per_kwh: "18.5000"
        idle_fee_per_min: "1.0000"
        currency: INR
        is_active: true

    UpdateTariffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        hub_id: {type: string, format: uuid}
        charger_id: {type: string, format: uuid}
        gst_id: {type: string, format: uuid}
        user_group_id: {type: string, format: uuid}
        price_per_kwh: {$ref: "#/components/schemas/DecimalInput"}
        idle_fee_per_min: {$ref: "#/components/schemas/DecimalInput"}
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
        is_active: {type: boolean}
        start_date:
          type: string
          format: date-time
          description: Validated with the resulting end_date.
        end_date:
          type: string
          format: date-time
          description: Validated with the resulting start_date.

    Tariff:
      type: object
      additionalProperties: false
      required:
        - id
        - cpo_id
        - hub_id
        - price_per_kwh
        - idle_fee_per_min
        - currency
        - is_active
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        hub_id: {type: string, format: uuid}
        charger_id: {type: string, format: uuid}
        gst_id: {type: string, format: uuid}
        user_group_id: {type: string, format: uuid}
        price_per_kwh: {$ref: "#/components/schemas/ExactDecimal"}
        idle_fee_per_min: {$ref: "#/components/schemas/ExactDecimal"}
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        is_active: {type: boolean}
        start_date: {type: string, format: date-time}
        end_date: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TariffListResponse:
      type: object
      additionalProperties: false
      required: [tariffs, has_more]
      properties:
        tariffs:
          type: array
          items:
            $ref: "#/components/schemas/Tariff"
        next_before:
          type: string
          format: date-time
        next_before_id:
          type: string
          format: uuid
        has_more:
          type: boolean

    CreateChargerMultipartRequest:
      type: object
      properties:
        data:
          description: JSON payload containing charger details.
          allOf:
            - $ref: "#/components/schemas/CreateChargerRequest"
        charger_image:
          type: string
          format: binary
          description: Charger image file (e.g., JPEG, PNG).
      required: [data, charger_image]

    UpdateChargerMultipartRequest:
      type: object
      properties:
        data:
          description: JSON payload containing charger details.
          allOf:
            - $ref: "#/components/schemas/UpdateChargerRequest"
        charger_image:
          type: string
          format: binary
          description: Optional charger image file (e.g., JPEG, PNG).

    ChargerStatus:
      type: string
      enum:
        - AVAILABLE
        - PREPARING
        - CHARGING
        - SUSPENDED_EV
        - SUSPENDED_EVSE
        - FINISHING
        - RESERVED
        - UNAVAILABLE
        - FAULTED
        - OFFLINE

    AuthScope:
      type: string
      enum: [PLATFORM, CPO, CUSTOMER]

    CPORole:
      type: string
      enum: [ADMIN]
      description: |
        Only ADMIN is callable in the current API. Other persisted membership
        enum values are dormant until a future staff-management contract.

    CPOAppIDMode:
      type: string
      enum: [DUMMY, LIVE]

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
              description: Safe human-readable explanation.
