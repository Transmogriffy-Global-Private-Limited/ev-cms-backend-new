            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/integrations:
    get:
      tags: [CPO Integrations]
      operationId: listCPOIntegrations
      summary: List configured integration metadata
      description: |
        Returns metadata only for the authenticated CPO. Secret plaintext is
        never returned. Requires the currently supported CPO ADMIN session, a changed initial
        password, and the current app-ID header.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Configured integration metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationListResponse"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `forbidden`, `password_change_required`, or `cpo_app_id_mismatch`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/integrations/{provider}:
    parameters:
      - $ref: "#/components/parameters/IntegrationProvider"
    get:
      tags: [CPO Integrations]
      operationId: getCPOIntegration
      summary: Get one integration's metadata
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Integration metadata without secret fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          description: "`missing_cpo_app_id` or `unsupported_integration_provider`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          $ref: "#/components/responses/IntegrationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [CPO Integrations]
      operationId: putCPOIntegration
      summary: Configure or atomically rotate Razorpay credentials
      description: |
        Stores one encrypted credential object for the authenticated CPO.
        Associated authenticated-encryption data binds it to CPO and provider.
        The response and audit log contain metadata only.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayCredentialsRequest"
      responses:
        "200":
          description: Stored integration metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          description: |
            `invalid_request`, `missing_cpo_app_id`,
            `unsupported_integration_provider`, or
            `invalid_integration_credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Integrations]
      operationId: deleteCPOIntegration
      summary: Remove the CPO's provider credentials
      description: Deletes the encrypted credential row and records a safe audit event.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Credentials removed. No response body.
        "400":
          description: "`missing_cpo_app_id` or `unsupported_integration_provider`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          $ref: "#/components/responses/IntegrationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWE
      description: Short-lived signed-then-encrypted administrative access token.
    CPOAppID:
      type: apiKey
      in: header
      name: X-CPO-App-ID
      description: |
        Current app ID for the CPO already established by BearerAuth. This is
        routing metadata, not an authentication secret or tenant selector.

  parameters:
    CPOAppIDHeader:
      name: X-CPO-App-ID
      in: header
      required: true
      description: |
        Current dummy or live app ID of the intended active CPO. It is public
        routing metadata, not a secret or user credential.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    CPOID:
      name: cpo_id
      in: path
      required: true
      description: Non-zero CPO UUID.
      schema:
        type: string
        format: uuid
    SessionID:
      name: session_id
      in: path
      required: true
      description: Session UUID owned by the current identity.
      schema:
        type: string
        format: uuid
    IntegrationProvider:
      name: provider
      in: path
      required: true
      description: Provider name. Input is normalized to uppercase.
      schema:
        type: string
        enum: [RAZORPAY]
    ChargerPublicID:
      name: charger_id
      in: path
      required: true
      description: Server-generated six-character lowercase public charger ID.
      schema:
        type: string
        pattern: "^[a-z0-9]{6}$"
      example: a1b2c3
    HubID:
      name: hub_id
      in: path
      required: true
      description: Server-generated hub UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    TariffID:
      name: tariff_id
      in: path
      required: true
      description: Server-generated tariff UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    GSTID:
      name: gst_id
      in: path
      required: true
      description: Server-generated GST-profile UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    ListBefore:
      name: before
      in: query
      required: false
      description: |
        Exclusive RFC3339 `created_at` cursor. Supply together with
        `before_id` from the previous response.
      schema:
        type: string
        format: date-time
    ListBeforeID:
      name: before_id
      in: query
      required: false
      description: Exclusive UUID tie-breaker supplied together with `before`.
      schema:
        type: string
        format: uuid
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size; defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    InvalidRequest:
      description: "`invalid_request` — malformed, oversized, unknown-field, or multiple-object JSON."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidChallenge:
      description: "`invalid_challenge` — challenge or OTP invalid, expired, consumed, invalidated, or not eligible."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: "`unauthorized` — bearer token absent, invalid, expired, revoked, or no longer authorized."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "`forbidden` — current session lacks platform authority."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: "`rate_limited` — durable source-address limit exceeded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MailUnavailable:
      description: "`mail_unavailable` — required mail production is disabled."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: "`internal_error` — operation failed without exposing internals."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCPOID:
      description: "`invalid_cpo_id` — path value is not a non-zero UUID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPONotFound:
      description: "`cpo_not_found` — no CPO has the supplied ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MissingCPOAppID:
      description: "`missing_cpo_app_id` — X-CPO-App-ID is absent or blank."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPOIntegrationForbidden:
      description: |
        `forbidden`, `password_change_required`, or `cpo_app_id_mismatch`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPOBusinessForbidden:
      description: |
        `forbidden`, `password_change_required`, or `cpo_app_id_mismatch`.
        Dormant OWNER, OPERATOR, and VIEWER role values do not grant callable
        CPO authority in the current ADMIN-only release.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IntegrationNotFound:
      description: "`integration_not_found` — provider credentials are not configured."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    EntitlementInput:
      type: object
      additionalProperties: false
      required: [feature_key, enabled]
      properties:
        feature_key:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
        enabled: {type: boolean}
        limit_value:
          type: integer
          format: int64
          minimum: 0
        configuration:
          type: object
          additionalProperties: true
          default: {}

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]

    CustomerSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          pattern: "^\\+?[0-9]{7,15}$"
          maxLength: 16

    CustomerSignupResponse:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - user_id
        - cpo_id
        - wallet_id
        - identity_created
        - use_existing_credentials
      properties:
        customer_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        cpo_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        identity_created:
          type: boolean
        use_existing_credentials:
          type: boolean
          description: |
            True when the email already owned a global identity. The submitted
            signup password was discarded and the customer must use their
            existing credentials during customer login.

    CustomerLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    CustomerTokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_at
        - refresh_token
        - session_expires_at
        - token_type
        - customer_id
        - cpo_id
        - cpo_app_id
      properties:
        access_token:
          type: string
          description: Signed-then-encrypted CUSTOMER-scope access JWT.
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          writeOnly: true
          description: Opaque one-time refresh token.
        session_expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          enum: [Bearer]
        customer_id:
          type: string
          format: uuid
        cpo_id:
          type: string
          format: uuid
        cpo_app_id:
          type: string

    CustomerMeResponse:
      type: object
      additionalProperties: false
      required: [user, customer, cpo, wallet]
      properties:
        user:
          $ref: "#/components/schemas/CustomerUser"
        customer:
          $ref: "#/components/schemas/CustomerRelationship"
        cpo:
          $ref: "#/components/schemas/CustomerCPO"
        wallet:
          $ref: "#/components/schemas/CustomerWallet"

    CustomerUser:
      type: object
      additionalProperties: false
      required: [id, email, full_name, is_verified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
        is_verified:
          type: boolean
        last_login_at:
          type: string
          format: date-time

    CustomerRelationship:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        user_group_id:
          type: string
          format: uuid

    CustomerCPO:
      type: object
      additionalProperties: false
      required: [id, business_name, app_id, app_id_mode]
      properties:
        id:
          type: string
          format: uuid
        business_name:
          type: string
        app_id:
          type: string
        app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"

    CustomerWallet:
      type: object
      additionalProperties: false
      required: [id, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: Exact decimal rendered as a string.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CustomerSession:
      type: object
      additionalProperties: false
      required:
        - id
        - user_agent
        - created_at
        - last_seen_at
        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        ip_address:
          type: string
        user_agent:
          type: string
          maxLength: 512
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    CustomerSessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSession"

    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, scope]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        scope:
          type: string
          enum: [PLATFORM]

    CPOLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, scope, cpo_id]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        scope:
          type: string
          enum: [CPO]
        cpo_id:
          type: string
          format: uuid

    ChallengeVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true

    ChallengeResendRequest:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid

    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_available_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code, new_password]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true

    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_at
        - refresh_token
        - session_expires_at
        - token_type
        - must_change_password
      properties:
        access_token:
          type: string
          description: Compact signed-then-encrypted JWT.
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Opaque one-time token. Store securely and replace after refresh.
        session_expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          enum: [Bearer]
        cpo_app_id:
          type: string
          description: Present only for CPO scope.
        cpo_app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"
        must_change_password:
          type: boolean

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - full_name
        - is_verified
        - mfa_enabled
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        is_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, scope]
      properties:
        user:
          $ref: "#/components/schemas/User"
        scope:
          $ref: "#/components/schemas/AuthScope"
        cpo_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CPORole"
        cpo_app_id:
          type: string
        cpo_app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"

    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - scope
        - user_agent
        - created_at
        - last_seen_at
        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/AuthScope"
        cpo_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CPORole"
        ip_address:
          type: string
        user_agent:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    CreateCPORequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - business_name
        - company_type
        - admin
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
          description: Trimmed/lowercased by the server; words separated by single hyphens.
        business_name:
          type: string
          minLength: 1
          maxLength: 255
        company_type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        gstin:
          type: string
          pattern: "^[0-9A-Za-z]{15}$"
          description: Trimmed and uppercased by the server.
        address:
          type: string
          maxLength: 5000
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          maxLength: 10
        admin:
          $ref: "#/components/schemas/InitialAdminRequest"

    InitialAdminRequest:
      type: object
      additionalProperties: false
      required: [email, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        full_name:
          type: string
          minLength: 1
          maxLength: 255

    SetCPOAppIDRequest:
      type: object
      additionalProperties: false
      required: [app_id]
      properties:
        app_id:
          type: string
          minLength: 16
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{16,100}$"
          description: Lowercased by the server; must not start with cpo_dummy_.

    UpdateCPOProfileRequest:
      type: object
      additionalProperties: false
      required:
        - business_name
        - company_type
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 255
        company_type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        gstin:
          type: string
          nullable: true
          pattern: "^[0-9A-Za-z]{15}$"
          description: Null, omission, or an empty submitted string clears the GSTIN.
        address:
          type: string
          maxLength: 5000
          description: Omission clears the stored address.
        city:
          type: string
          maxLength: 100
          description: Omission clears the stored city.
        state:
          type: string
          maxLength: 100
          description: Omission clears the stored state.
        pincode:
          type: string
          maxLength: 10
          description: Omission clears the stored pincode.

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Trimmed human reason retained in privileged audit evidence.

    SetPrimaryAdminRequest:
      type: object
      additionalProperties: false
      required: [email, full_name, reason]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Used only when a new global identity must be created.
        reason:
          type: string
          minLength: 3
          maxLength: 500

    CPO:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - business_name
        - company_type
        - address
        - city
        - state
        - pincode
        - status
        - status_reason
        - status_changed_at
        - app_id
        - app_id_mode
        - app_id_updated_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        business_name:
          type: string
        company_type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        gstin:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
