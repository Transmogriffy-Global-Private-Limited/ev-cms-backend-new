                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          $ref: "#/components/responses/IntegrationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [CPO Operations - Integrations]
      operationId: putCPOIntegration
      summary: Configure or atomically rotate Razorpay credentials
      description: |
        Stores one encrypted credential object for the authenticated CPO.
        Associated authenticated-encryption data binds it to CPO and provider.
        The response and audit log contain metadata only.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayCredentialsRequest"
      responses:
        "200":
          description: Stored integration metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          description: |
            `invalid_request`, `missing_cpo_app_id`,
            `unsupported_integration_provider`, or
            `invalid_integration_credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Operations - Integrations]
      operationId: deleteCPOIntegration
      summary: Remove the CPO's provider credentials
      description: Deletes the encrypted credential row and records a safe audit event.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Credentials removed. No response body.
        "400":
          description: "`missing_cpo_app_id` or `unsupported_integration_provider`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOIntegrationForbidden"
        "404":
          $ref: "#/components/responses/IntegrationNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/plans:
    get:
      tags: [Superadmin - Manual Subscriptions]
      operationId: listSubscriptionPlans
      summary: List the platform subscription catalog
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Plans and all versions, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: createSubscriptionPlan
      summary: Create a draft subscription plan and its first draft version
      description: The server generates all identifiers. A plan cannot be issued until a superadmin publishes its version.
      security: [{BearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSubscriptionPlanRequest"}}}}
      responses:
        "201": {description: Draft plan created, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanView"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/plans/{plan_id}:
    get:
      tags: [Superadmin - Manual Subscriptions]
      operationId: getSubscriptionPlan
      summary: Get a subscription plan and its versions
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      responses:
        "200": {description: Plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanView"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionPlanNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/plans/{plan_id}/draft:
    put:
      tags: [Superadmin - Manual Subscriptions]
      operationId: updateSubscriptionPlanDraft
      summary: Create or replace the plan's single editable draft version
      description: Published versions are immutable. This operation creates the next server-numbered version when no draft exists.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateSubscriptionPlanDraftRequest"}}}}
      responses:
        "200": {description: Updated plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanView"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionPlanNotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/plans/{plan_id}/publish:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: publishSubscriptionPlan
      summary: Publish the plan's current draft version
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      responses:
        "200": {description: Published plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanView"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionPlanNotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/plans/{plan_id}/archive:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: archiveSubscriptionPlan
      summary: Archive a plan so it can no longer be issued
      description: Existing subscriptions continue to retain their immutable plan version.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/PlanID"}]
      responses:
        "200": {description: Archived plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanView"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionPlanNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/subscription:
    get:
      tags: [Superadmin - Manual Subscriptions]
      operationId: getCurrentCPOSubscription
      summary: Get the CPO's current manually managed subscription
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      responses:
        "200": {description: Current subscription, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionNotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: issueCPOSubscription
      summary: Manually issue a subscription from a published plan version
      description: This is a platform-superadmin command, not payment-provider fulfillment. It records a period and does not automatically renew, activate, or alter CPO administrative access. The lifecycle worker expires elapsed periods, which narrowly gates new customer starts and recharge orders.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IssueSubscriptionRequest"}}}}
      responses:
        "201": {description: Subscription issued, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionPublishedVersionNotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/subscription/renew:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: renewCPOSubscription
      summary: Manually record the next subscription period
      description: This command recalculates the period from the recorded plan terms. It renews a current subscription and also reactivates an `EXPIRED` record after manual payment confirmation; an expired record cannot be backdated into another elapsed period. It does not reactivate a paused or past-due subscription.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RenewSubscriptionRequest"}}}}
      responses: &subscriptionActionResponses
        "200": {description: Updated subscription, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "404": {$ref: "#/components/responses/SubscriptionNotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/subscription/change-plan:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: changeCPOSubscriptionPlan
      summary: Immediately switch a current subscription to a published plan version
      description: Scheduled provider changes are intentionally unsupported; this command is the explicit manual action.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChangeSubscriptionPlanRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/activate:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: activateCPOTrialSubscription
      summary: Manually activate a trial subscription
      description: Passing a trial end date alone changes nothing. A superadmin must activate it explicitly.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/pause:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: pauseCPOSubscription
      summary: Manually pause a subscription
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/resume:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: resumeCPOSubscription
      summary: Manually resume a paused or past-due subscription
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/mark-past-due:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: markCPOSubscriptionPastDue
      summary: Manually record that a subscription is past due
      description: This does not query or create a payment; it is an audited platform decision.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/expire:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: expireCPOSubscription
      summary: Manually expire a subscription
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/cancel:
    post:
      tags: [Superadmin - Manual Subscriptions]
      operationId: cancelCPOSubscription
      summary: Manually cancel a subscription immediately
      description: Cancellation-at-period-end is intentionally unsupported. The lifecycle worker only records elapsed-period expiry; it never performs scheduled cancellation.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionTransitionRequest"}}}}
      responses: *subscriptionActionResponses

  /api/v1/platform/cpos/{cpo_id}/subscription/history:
    get:
      tags: [Superadmin - Manual Subscriptions]
      operationId: listCPOSubscriptionHistory
      summary: List up to 500 audited manual subscription transitions
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOID"}]
      responses:
        "200": {description: Newest-first history, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionHistoryResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/PlatformForbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/app/charging-sessions:
    get:
      tags: [App Charging]
      operationId: listCustomerChargingSessions
      summary: List the authenticated customer's materialized charging sessions
      description: Returns only durable CMS charging sessions owned by the authenticated CPO-local customer. It never includes unmaterialized start intents, HAL command records, or raw HAL facts. Results are ordered by `started_at DESC, id DESC`; send `before` and `before_id` together to continue a page.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - {$ref: "#/components/parameters/ListBefore"}
        - {$ref: "#/components/parameters/ListBeforeID"}
        - {$ref: "#/components/parameters/ListLimit"}
      responses:
        "200": {description: Bounded customer charging-session history, content: {application/json: {schema: {$ref: "#/components/schemas/ChargingSessionHistoryResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [App Charging]
      operationId: startCustomerCharging
      summary: Create a durable charging start intent
      description: Creates the CMS tariff/tax snapshot, affordability reservation, one-use credential, and durable HAL command identity only after exact charger/connector mapping synchronization succeeds. A new start is commercially blocked with `403 cpo_subscription_expired` when the CPO subscription is explicitly expired or its current period has elapsed. A same-customer retry of an existing active intent remains readable. A new start is admitted only when the committed CMS live-operations projection reports the requested connector as `AVAILABLE` and `FRESH`; `409 connector_not_available` is expected when that projection or a competing active intent prevents admission. After the CPO minimum-balance check, tariff/GST affordability and the HAL Wh limit use `wallet balance - CPO wallet buffer`; `409 wallet_minimum_balance_not_met` means the balance is below the configured minimum, while `409 insufficient_wallet_balance` means no positive affordable session remains. `RECONCILIATION_REQUIRED` means an invoked HAL start command has an unresolved delivery outcome; an exact command lookup that returns 404 terminalizes that start, releases its held reservation, and permits a fresh retry. `202` is not proof that charging started; only a later HAL `transaction.started` fact materializes a session.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/CPOAppIDHeader"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChargingStartRequest"}
      responses:
        "202": {description: Durable start intent accepted for delivery or reconciliation, content: {application/json: {schema: {$ref: "#/components/schemas/ChargingStartResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "`cpo_app_id_mismatch`, wrong session plane, or `cpo_subscription_expired` for a new start.", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Customer charger or connector was not found.}
        "409": {description: "`connector_not_available`, `wallet_minimum_balance_not_met`, or `insufficient_wallet_balance` prevents a new start; an active intent can also own the connector.", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "503": {description: "`hal_unavailable` or `charger_mapping_unavailable`: HAL or the required exact charger mapping is temporarily unavailable; no active start intent is created for a preflight mapping failure.", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}

  /api/v1/app/charging-start-intents/{start_intent_id}:
    get:
      tags: [App Charging]
      operationId: getCustomerChargingStartIntent
      summary: Poll customer-owned charging-start progress
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - name: start_intent_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Durable customer start progress, content: {application/json: {schema: {$ref: "#/components/schemas/ChargingStartResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Customer start intent was not found.}

  /api/v1/app/charging-sessions/{session_id}:
    get:
      tags: [App Charging]
      operationId: getCustomerChargingSession
      summary: Poll the customer-owned active or completed charging projection
      description: Returns only CMS-durable state. Meter values are exact received OCPP facts and are never interpolated. Connection and connector freshness become stale if the charger is not currently online. Historical tariff and tax values come from the frozen session snapshots, never today's tariff.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - name: session_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Customer charging session projection, content: {application/json: {schema: {$ref: "#/components/schemas/ChargingSessionResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Customer charging session was not found.}

  /api/v1/app/charging-sessions/{session_id}/stop:
    post:
      tags: [App Charging]
      operationId: stopCustomerCharging
      summary: Persist and request a customer stop
      description: "202 only records a durable CMS/HAL stop command request. A charger-originated HAL transaction.completed fact establishes completion and settlement."
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - name: session_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChargingStopRequest"}
      responses:
        "202": {description: Durable stop request accepted.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Customer charging session was not found.}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {description: HAL charging service is unavailable.}

  /api/v1/app/operations/events:
    get:
      tags: [App Charging]
      operationId: listCustomerOperationalEvents
      summary: Recover the customer's retained charging events
      description: Returns only events scoped to the authenticated customer or safe tenant charger/connector availability events. For a `CHARGING_SESSION` event, `resource_id` is the materialized CMS charging-session UUID accepted by GET /api/v1/app/charging-sessions/{session_id}. Session and charger REST projections remain authoritative.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: Ordered retained operational events, content: {application/json: {schema: {$ref: "#/components/schemas/OperationalEventPage"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/app/operations/realtime/stream:
    get:
      tags: [App Charging]
      operationId: streamCustomerOperationalEvents
      summary: Stream the customer's retained charging events using SSE
      description: Bearer-authenticated SSE with CPO app-ID scope and heartbeat revalidation. Use fetch streaming, deduplicate event IDs, and recover with the matching REST route. For a `CHARGING_SESSION` event, `resource_id` is the materialized CMS charging-session UUID accepted by GET /api/v1/app/charging-sessions/{session_id}.
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/CPOAppIDHeader"}
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: text/event-stream of OperationalEvent records.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/hal-facts:
    post:
      tags: [HAL Service Integration]
      operationId: receiveHALFact
      summary: Durably receive one immutable HAL OCPP fact
      description: "Requires the independent HAL-to-CMS service bearer and Idempotency-Key equal to fact_id. Exact duplicate immutable facts return 204; altered reuse of a fact ID returns 409 without applying business state."
      security: [{HALFactBearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HALFactEnvelope"}
      responses:
        "204": {description: Durable receipt and safe application or exact duplicate acknowledgement.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {description: HAL fact is semantically invalid or unsafe to apply.}

components:
  headers:
    RequestID:
      description: Server-generated UUID for correlation with the HTTP completion log.
      schema:
        type: string
        format: uuid

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWE
      description: Short-lived signed-then-encrypted administrative access token.
    HALFactBearer:
      type: http
      scheme: bearer
      description: Independent opaque HAL-to-CMS service bearer. It is never a customer or staff access token.
    CPOAppID:
      type: apiKey
      in: header
      name: X-CPO-App-ID
      description: |
        Current app ID for the CPO already established by BearerAuth. This is
        routing metadata, not an authentication secret or tenant selector.

  parameters:
    CPOAppIDHeader:
      name: X-CPO-App-ID
      in: header
      required: true
      description: |
        Current dummy or live app ID of the intended active CPO. It is public
        routing metadata, not a secret or user credential.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the same key only with the same recharge amount when retrying order creation.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    MembershipID:
      name: membership_id
      in: path
      required: true
      description: Non-zero CPO membership UUID.
      schema:
        type: string
        format: uuid
    SupportTicketID:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CPOID:
      name: cpo_id
      in: path
      required: true
      description: Non-zero CPO UUID.
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      description: Global identity UUID managed by the authenticated platform superadmin.
      schema:
        type: string
        format: uuid
    MailJobID:
      name: job_id
      in: path
      required: true
      description: Mail-outbox job UUID.
      schema:
        type: string
        format: uuid
    NotificationID:
      name: notification_id
      in: path
      required: true
      description: Durable platform notification UUID owned by the current recipient.
      schema:
        type: string
        format: uuid
    PlanID:
      name: plan_id
      in: path
      required: true
      description: Server-generated subscription plan UUID.
      schema:
        type: string
        format: uuid
    SessionID:
      name: session_id
      in: path
      required: true
      description: Session UUID owned by the current identity.
      schema:
        type: string
        format: uuid
    IntegrationProvider:
      name: provider
      in: path
      required: true
      description: Provider name. Input is normalized to uppercase.
      schema:
        type: string
        enum: [RAZORPAY]
    ChargerPublicID:
      name: charger_id
      in: path
      required: true
      description: Server-generated six-character lowercase public charger ID.
      schema:
        type: string
        pattern: "^[a-z0-9]{6}$"
      example: a1b2c3
    ChargerInternalID:
      name: charger_id
      in: path
      required: true
      description: Server-generated internal charger UUID owned by the authenticated CPO. This is distinct from the six-character public charger ID.
      schema:
        type: string
        format: uuid
    HubID:
      name: hub_id
      in: path
      required: true
      description: Server-generated hub UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    TariffID:
      name: tariff_id
      in: path
      required: true
      description: Server-generated tariff UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    GSTID:
      name: gst_id
      in: path
      required: true
      description: Server-generated GST-profile UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    UserGroupID:
      name: user_group_id
      in: path
      required: true
      description: Server-generated user group UUID owned by the authenticated CPO.
      schema:
        type: string
        format: uuid
    ListBefore:
      name: before
      in: query
      required: false
      description: |
        Exclusive RFC3339 `created_at` cursor. Supply together with
        `before_id` from the previous response.
      schema:
        type: string
        format: date-time
    ListBeforeID:
      name: before_id
      in: query
      required: false
      description: Exclusive UUID tie-breaker supplied together with `before`.
      schema:
        type: string
        format: uuid
    AfterID:
      name: after_id
      in: query
      required: false
      description: Exclusive durable event cursor. `Last-Event-ID` is an equivalent SSE fallback header.
      schema: {type: integer, format: int64, minimum: 0}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size; defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LiveSessionLimit:
      name: limit
      in: query
      required: false
      description: Page size for the current live-session snapshot; defaults to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    LiveSessionAfterStartedAt:
      name: after_started_at
      in: query
      required: false
      description: Exclusive RFC3339 start-time cursor. Supply with after_id from the previous page.
      schema:
        type: string
        format: date-time
    LiveSessionAfterID:
      name: after_id
      in: query
      required: false
      description: Exclusive UUID tie-breaker. Requires after_started_at.
      schema:
        type: string
        format: uuid

  responses:
    InvalidRequest:
      description: "`invalid_request` — malformed, oversized, unknown-field, or multiple-object JSON."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidChallenge:
      description: "`invalid_challenge` — challenge or OTP invalid, expired, consumed, invalidated, or not eligible."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: "`unauthorized` — bearer token absent, invalid, expired, revoked, or no longer authorized."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "`forbidden` — current session lacks platform authority."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PlatformForbidden:
      description: "`permission_denied` — platform-superadmin authority is required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: "The requested operation conflicts with current durable state."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SubscriptionPlanNotFound:
      description: "`subscription_plan_not_found` — no subscription plan has the supplied ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SubscriptionPublishedVersionNotFound:
      description: "`published_plan_version_not_found` — the version is unpublished or its plan is archived."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SubscriptionNotFound:
      description: "`subscription_not_found` — the CPO has no current subscription."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: "`rate_limited` — durable source-address limit exceeded."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MailUnavailable:
      description: "`mail_unavailable` — required mail production is disabled."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: "`internal_error` — operation failed without exposing internals."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCPOID:
      description: "`invalid_cpo_id` — path value is not a non-zero UUID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPONotFound:
      description: "`cpo_not_found` — no CPO has the supplied ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PlatformAdminNotFound:
      description: "`platform_admin_not_found` — no platform authority record has the supplied user ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdentityNotFound:
      description: "`identity_not_found` — no global identity has the supplied user ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MailJobNotFound:
      description: "`mail_job_not_found` — no mail-outbox job has the supplied ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotificationNotFound:
      description: "`notification_not_found` — the notification is not owned by the current recipient."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MissingCPOAppID:
      description: "`missing_cpo_app_id` — X-CPO-App-ID is absent or blank."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPOIntegrationForbidden:
      description: |
        `forbidden`, `password_change_required`, or `cpo_app_id_mismatch`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CPOBusinessForbidden:
      description: |
        `forbidden`, `password_change_required`, or `cpo_app_id_mismatch`.
        Dormant OWNER, OPERATOR, and VIEWER role values do not grant callable
        CPO authority in the current ADMIN-only release.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IntegrationNotFound:
      description: "`integration_not_found` — provider credentials are not configured."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    AdministratorPage:
      type: object
      additionalProperties: false
      required: [administrators, has_more]
      properties:
        administrators: {type: array, items: {$ref: "#/components/schemas/Administrator"}}
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}
    Administrator:
      type: object
      additionalProperties: false
      required: [user_id, email, full_name, identity_active, identity_verified, authority_active, status_reason, status_changed_at, created_at, updated_at]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
        identity_active: {type: boolean}
        identity_verified: {type: boolean}
        authority_active: {type: boolean}
        status_reason: {type: string}
        status_changed_at: {type: string, format: date-time}
        status_changed_by_user_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InviteAdministratorRequest:
      type: object
      additionalProperties: false
      required: [email, full_name]
      properties:
        email: {type: string, format: email, maxLength: 320}
        full_name: {type: string, minLength: 1, maxLength: 255}
    LockedIdentityPage:
      type: object
      additionalProperties: false
      required: [identities, has_more]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/LockedIdentity"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}
    LockedIdentity:
      type: object
      additionalProperties: false
      required: [user_id, email, full_name, locked_until]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
        locked_until: {type: string, format: date-time}
    SessionRevocationRequest:
      type: object
      additionalProperties: false
      required: [reason, scope]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        scope: {type: string, enum: [PLATFORM, CPO, ALL]}
        cpo_id: {type: string, format: uuid, description: Required when scope is CPO.}
    MailPage:
      type: object
      additionalProperties: false
      required: [jobs, has_more]
      properties:
        jobs: {type: array, items: {$ref: "#/components/schemas/MailJob"}}
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}
    MailJob:
      type: object
      additionalProperties: false
      required: [id, to_email, template, status, attempts, max_attempts, available_at, error_present, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        to_email: {type: string, format: email}
        cpo_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        template: {type: string}
        status: {type: string, enum: [PENDING, PROCESSING, SENT, FAILED, CANCELED]}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 0}
        available_at: {type: string, format: date-time}
        locked_at: {type: string, format: date-time}
        error_present: {type: boolean, description: True when a failure exists; the stored error text is never returned.}
        sent_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MailMetricsResponse:
      type: object
      additionalProperties: false
      required: [metrics]
      properties:
        metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [template, status, count]
            properties:
              template: {type: string}
              status: {type: string, enum: [PENDING, PROCESSING, SENT, FAILED, CANCELED]}
              count: {type: integer, format: int64, minimum: 0}
    MailReconcileResponse:
      type: object
      additionalProperties: false
      required: [requeued]
      properties:
        requeued: {type: integer, format: int64, minimum: 0}
    MailRetentionRequest:
      type: object
      additionalProperties: false
      required: [before, reason]
      properties:
        before: {type: string, format: date-time, description: Must be at least 30 days before the current server time.}
        reason: {type: string, minLength: 3, maxLength: 500}
    MailRetentionResponse:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: {type: integer, format: int64, minimum: 0}
    AnnouncementPage:
      type: object
      additionalProperties: false
      required: [announcements, has_more]
      properties:
        announcements: {type: array, items: {$ref: "#/components/schemas/Announcement"}}
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}
    AnnouncementRequest:
      type: object
      additionalProperties: false
      required: [audience, title, body]
      properties:
        audience: {type: string, enum: [PLATFORM, CPO]}
        cpo_id: {type: string, format: uuid, description: Required only for CPO audience.}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 10000}
        expires_at: {type: string, format: date-time, description: Optional future expiry.}
    Announcement:
      type: object
      additionalProperties: false
      required: [id, audience, title, body, created_by_user_id, created_at, recipient_count]
      properties:
        id: {type: string, format: uuid}
        audience: {type: string, enum: [PLATFORM, CPO]}
        cpo_id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_by_user_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        recipient_count: {type: integer, format: int64, minimum: 0}
    NotificationPage:
      type: object
      additionalProperties: false
      required: [notifications, has_more]
      properties:
        notifications: {type: array, items: {$ref: "#/components/schemas/Notification"}}
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}
    Notification:
      type: object
      additionalProperties: false
      required: [id, announcement_id, audience, title, body, created_at]
      properties:
        id: {type: string, format: uuid}
        announcement_id: {type: string, format: uuid}
        audience: {type: string, enum: [PLATFORM, CPO]}
        cpo_id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [cpos, active_platform_admins, active_sessions, mail, workers]
      properties:
        cpos: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        active_platform_admins: {type: integer, format: int64, minimum: 0}
        active_sessions:
          type: integer
          format: int64
          minimum: 0
          description: Active administrative plus CPO-local customer sessions.
        mail: {type: object, additionalProperties: {type: integer, format: int64, minimum: 0}}
        workers: {type: array, items: {$ref: "#/components/schemas/WorkerStatus"}}
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, version, database, workers]
      properties:
        service: {type: string}
        version: {type: string}
        database: {type: string, enum: [connected, unavailable]}
        workers: {type: array, items: {$ref: "#/components/schemas/WorkerStatus"}}
    WorkerStatus:
      type: object
      additionalProperties: false
      required: [name, status, required]
      properties:
        name: {type: string}
        status: {type: string}
        required: {type: boolean}
    SubscriptionPlanTerms:
      type: object
      additionalProperties: false
      required: [currency, price_minor, billing_interval, interval_count, trial_days]
      properties:
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        price_minor: {type: integer, format: int64, minimum: 0}
        billing_interval: {type: string, enum: [MONTHLY, YEARLY]}
        interval_count: {type: integer, minimum: 1, maximum: 120}
        trial_days: {type: integer, minimum: 0, maximum: 365}
    CreateSubscriptionPlanRequest:
      type: object
      additionalProperties: false
      required: [code, name, terms]
      properties:
        code: {type: string, maxLength: 80, pattern: "^[a-z0-9]+(?:_[a-z0-9]+)*$"}
        name: {type: string, minLength: 1, maxLength: 150}
        description: {type: string, maxLength: 2000, default: ""}
        terms: {$ref: "#/components/schemas/SubscriptionPlanTerms"}
    UpdateSubscriptionPlanDraftRequest:
      type: object
      additionalProperties: false
      required: [name, terms]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        description: {type: string, maxLength: 2000, default: ""}
        terms: {$ref: "#/components/schemas/SubscriptionPlanTerms"}
    SubscriptionPlan:
      type: object
      additionalProperties: false
      required: [id, code, name, description, status, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionPlanVersion:
      type: object
      additionalProperties: false
      required: [id, plan_id, version, status, currency, price_minor, billing_interval, interval_count, trial_days, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, PUBLISHED]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        price_minor: {type: integer, format: int64, minimum: 0}
        billing_interval: {type: string, enum: [MONTHLY, YEARLY]}
        interval_count: {type: integer}
        trial_days: {type: integer}
        published_at: {type: string, format: date-time}
        published_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionPlanView:
      type: object
      additionalProperties: false
      required: [plan, published_versions]
      properties:
        plan: {$ref: "#/components/schemas/SubscriptionPlan"}
        draft: {$ref: "#/components/schemas/SubscriptionPlanVersion"}
        published_versions: {type: array, items: {$ref: "#/components/schemas/SubscriptionPlanVersion"}}
    SubscriptionPlanListResponse:
      type: object
      additionalProperties: false
      required: [plans]
      properties:
        plans: {type: array, items: {$ref: "#/components/schemas/SubscriptionPlanView"}}
    SubscriptionActionFields:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        idempotency_key: {type: string, minLength: 1, maxLength: 120}
    IssueSubscriptionRequest:
      allOf:
        - $ref: "#/components/schemas/SubscriptionActionFields"
        - type: object
          required: [plan_version_id]
          properties:
            plan_version_id: {type: string, format: uuid}
            starts_at: {type: string, format: date-time, description: Optional past or current provision date.}
    RenewSubscriptionRequest:
      allOf:
        - $ref: "#/components/schemas/SubscriptionActionFields"
        - type: object
          properties:
            starts_at: {type: string, format: date-time, description: Optional past or current period start.}
    ChangeSubscriptionPlanRequest:
      allOf:
        - $ref: "#/components/schemas/SubscriptionActionFields"
        - type: object
          required: [plan_version_id]
          properties:
            plan_version_id: {type: string, format: uuid}
    SubscriptionTransitionRequest:
      $ref: "#/components/schemas/SubscriptionActionFields"
    CPOSubscription:
      type: object
      additionalProperties: false
      required: [id, cpo_id, plan_version_id, status, starts_at, current_period_starts_at, current_period_ends_at, cancel_at_period_end, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        plan_version_id: {type: string, format: uuid}
        status: {type: string, enum: [TRIAL, ACTIVE, PAUSED, PAST_DUE, CANCELLED, EXPIRED]}
        starts_at: {type: string, format: date-time}
        trial_ends_at: {type: string, format: date-time}
        current_period_starts_at: {type: string, format: date-time}
        current_period_ends_at: {type: string, format: date-time}
        cancel_at_period_end: {type: boolean, description: Always false for manually managed subscriptions.}
        pending_plan_version_id: {type: string, format: uuid, description: Always absent; scheduled changes are unsupported.}
        pending_change_at: {type: string, format: date-time}
        cancelled_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionView:
      type: object
      additionalProperties: false
      required: [subscription, plan, plan_version]
      properties:
        subscription: {$ref: "#/components/schemas/CPOSubscription"}
        plan: {$ref: "#/components/schemas/SubscriptionPlan"}
        plan_version: {$ref: "#/components/schemas/SubscriptionPlanVersion"}
    CPOSubscriptionHistory:
      type: object
      additionalProperties: false
      required: [id, subscription_id, cpo_id, next_status, next_plan_version_id, actor_user_id, reason, idempotency_key, effective_at, metadata, created_at]
      properties:
        id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        cpo_id: {type: string, format: uuid}
        previous_status: {type: string, enum: [TRIAL, ACTIVE, PAUSED, PAST_DUE, CANCELLED, EXPIRED]}
        next_status: {type: string, enum: [TRIAL, ACTIVE, PAUSED, PAST_DUE, CANCELLED, EXPIRED]}
        previous_plan_version_id: {type: string, format: uuid}
        next_plan_version_id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid}
        reason: {type: string}
        idempotency_key: {type: string}
        effective_at: {type: string, format: date-time}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    SubscriptionHistoryResponse:
      type: object
      additionalProperties: false
      required: [history]
      properties:
        history: {type: array, items: {$ref: "#/components/schemas/CPOSubscriptionHistory"}}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]

    CustomerSignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          pattern: "^\\+?[0-9]{7,15}$"
          maxLength: 16

    CustomerSignupResponse:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - cpo_id
        - wallet_id
      properties:
        customer_id:
          type: string
          format: uuid
        cpo_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid

    CustomerLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    CustomerTokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_at
        - refresh_token
        - session_expires_at
        - token_type
        - customer_id
        - cpo_id
        - cpo_app_id
      properties:
        access_token:
          type: string
          description: Signed-then-encrypted CUSTOMER-scope access JWT.
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          writeOnly: true
          description: Opaque one-time refresh token.
        session_expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          enum: [Bearer]
        customer_id:
          type: string
          format: uuid
        cpo_id:
          type: string
          format: uuid
        cpo_app_id:
          type: string

    CustomerMeResponse:
      type: object
      additionalProperties: false
      required: [user, customer, cpo, wallet]
      properties:
        user:
          $ref: "#/components/schemas/CustomerUser"
        customer:
          $ref: "#/components/schemas/CustomerRelationship"
        cpo:
          $ref: "#/components/schemas/CustomerCPO"
        wallet:
          $ref: "#/components/schemas/CustomerWallet"

    CustomerUser:
      type: object
      description: |
        Compatibility-shaped app account projection. `id` is the CPO-local
        customer account ID and equals `customer.id`; it is not a global user ID.
      additionalProperties: false
      required: [id, email, full_name, is_verified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
        is_verified:
          type: boolean
        usergroup_assigned:
          type: boolean
          description: Whether the customer currently belongs to a user group.
        last_login_at:
          type: string
          format: date-time

    UpdateCustomerProfileRequest:
      type: object
      additionalProperties: false
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed CPO-local customer display name.
          example: Asha Das
        phone:
          type: string
          nullable: true
          minLength: 7
          maxLength: 16
          pattern: "^\\+?[0-9]{7,15}$"
          description: Optional normalized phone. Omit to preserve; send null to clear.
          example: "+919876543210"

    CustomerRelationship:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
        user_group_id:
          type: string
          format: uuid

    CustomerCPO:
      type: object
      additionalProperties: false
      required: [id, business_name, app_id, app_id_mode]
      properties:
        id:
          type: string
          format: uuid
        business_name:
          type: string
        app_id:
          type: string
        app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"

    CustomerWallet:
      type: object
      additionalProperties: false
      required: [id, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          description: Exact decimal rendered as a string.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CustomerSession:
      type: object
      additionalProperties: false
      required:
        - id
        - user_agent
        - created_at
        - last_seen_at
        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        ip_address:
          type: string
        user_agent:
          type: string
          maxLength: 512
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    CustomerSessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSession"

    CustomerHubListResponse:
      type: object
      additionalProperties: false
      required: [hubs, has_more]
      properties:
        hubs:
          type: array
          items:
            $ref: "#/components/schemas/CustomerHubSummary"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CustomerHubSummary:
      type: object
      additionalProperties: false
      required: [id, name, address, latitude, longitude, open_24_hours, customer_visible, charger_count, is_favorite]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        address: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        open_24_hours:
          type: boolean
          description: Opening-hours flag for this hub.
        customer_visible:
          type: boolean
          enum: [true]
          description: Always true because unpublished hubs are not returned.
        charger_count: {type: integer, minimum: 0}
        is_favorite: {type: boolean}

    CustomerHub:
      allOf:
        - $ref: "#/components/schemas/CustomerHubSummary"
        - type: object
          additionalProperties: false
          required: [chargers]
          properties:
            chargers:
              type: array
              items:
                $ref: "#/components/schemas/CustomerCharger"

    CustomerCharger:
      type: object
      additionalProperties: false
      required: [id, hub_id, charger_id, max_power_kw, ocpp_version, status, twenty_four_seven_open_status, availability, availability_freshness, is_favorite, connectors]
      properties:
        id: {type: string, format: uuid}
        hub_id: {type: string, format: uuid}
        charger_id:
          type: string
          pattern: "^[a-z0-9]{6}$"
          description: Server-generated public six-character charger identity. New chargers use this same value as ocpp_identity.
        charger_name: {type: string, maxLength: 255}
        vendor: {type: string, maxLength: 100, nullable: true}
        model: {type: string, maxLength: 100, nullable: true}
        max_power_kw: {type: number, minimum: 0}
        ocpp_version: {type: string, maxLength: 20}
        status:
          $ref: "#/components/schemas/ChargerStatus"
        charger_image_url:
          type: string
          format: uri-reference
          description: Relative authenticated User App image route, present only when this charger has an uploaded image.
        charger_type: {type: string, maxLength: 100}
        segment: {type: string, maxLength: 100}
        sub_segment: {type: string, maxLength: 100}
        charger_use_type: {type: string, maxLength: 100}
        parking: {type: string, maxLength: 100}
        hub_name: {type: string, maxLength: 255}
        hub_address: {type: string}
        hub_latitude: {type: number, minimum: -90, maximum: 90}
        hub_longitude: {type: number, minimum: -180, maximum: 180}
        twenty_four_seven_open_status:
          type: boolean
          description: Opening-hours flag for this charger, independent of its hub.
        hub_open_24_hours:
          type: boolean
          description: Opening-hours flag for the attached hub.
        distance_km: {type: number, minimum: 0}
        availability:
          type: string
          enum: [AVAILABLE, CHARGING, FAULTED, UNAVAILABLE, UNKNOWN]
          description: Committed CMS HAL projection overlaid on every full customer charger response. Static CMS inactive/suspended/maintenance/decommissioned inventory is unavailable; this field never causes a synchronous HAL call.
        availability_freshness:
          type: string
          enum: [FRESH, STALE, UNKNOWN]
          description: Freshness of the committed parent charger connection projection.
        is_favorite: {type: boolean}
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/CustomerConnector"

    CustomerConnector:
      type: object
      additionalProperties: false
      required: [id, connector_number, connector_type, connector_total_capacity, status, availability, freshness]
      properties:
        id: {type: string, format: uuid}
        connector_number: {type: integer, minimum: 1}
        connector_type: {type: string, maxLength: 50}
        connector_total_capacity: {type: number, minimum: 0}
        status:
          $ref: "#/components/schemas/ChargerStatus"
        availability:
          type: string
          enum: [AVAILABLE, CHARGING, FAULTED, UNAVAILABLE, UNKNOWN]
          description: Committed CMS HAL connector projection overlaid on every full customer charger response. Static CMS inactive/suspended/maintenance/decommissioned inventory is unavailable; this field never causes a synchronous HAL call.
        freshness:
          type: string
          enum: [FRESH, STALE, UNKNOWN]

    CustomerChargerListResponse:
      type: object
      additionalProperties: false
      required: [chargers, has_more]
      properties:
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerCharger"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CustomerChargerLocation:
      type: object
      additionalProperties: false
      required: [charger_name, latitude, longitude]
      properties:
        charger_name: {type: string, maxLength: 255}
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude of the charger's attached published hub.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude of the charger's attached published hub.

    CustomerChargerLocationListResponse:
      type: object
      additionalProperties: false
      required: [chargers, has_more]
      properties:
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerChargerLocation"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CustomerWalletResponse:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet:
          $ref: "#/components/schemas/CustomerWalletDetails"

    CustomerWalletTransaction:
      type: object
      additionalProperties: false
      required: [id, amount, transaction_type, description, status, created_at]
      properties:
        id: {type: string, format: uuid}
        amount: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"}
        transaction_type: {type: string, enum: [CREDIT, DEBIT]}
        description: {type: string, maxLength: 255}
        session_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, COMPLETED, FAILED, REVERSED]}
        created_at: {type: string, format: date-time}

    CustomerWalletTransactionListResponse:
      type: object
      additionalProperties: false
      required: [wallet, transactions, has_more]
      properties:
        wallet:
          $ref: "#/components/schemas/CustomerWalletDetails"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/CustomerWalletTransaction"
        next_before: {type: string, format: date-time}
        next_before_id: {type: string, format: uuid}
        has_more: {type: boolean}

    CustomerWalletDetails:
      type: object
      additionalProperties: false
      required: [id, balance, usable_balance, minimum_recharge_amount, wallet_min_balance, wallet_buffer_min_balance, currency, updated_at]
      properties:
        id: {type: string, format: uuid}
        balance: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"}
        usable_balance:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"
          description: Current balance less the CPO buffer, clamped to zero; it does not itself override the CPO minimum-start requirement.
        minimum_recharge_amount:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"
          description: Amount needed to reach the CPO minimum balance, or zero when the balance already meets it. It does not add the CPO buffer.
        wallet_min_balance:
          type: integer
          minimum: 0
          description: Current CPO whole-currency threshold for starting a new charging session.
        wallet_buffer_min_balance:
          type: integer
          minimum: 0
          description: Current CPO whole-currency amount excluded from a new session's usable balance.
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        updated_at: {type: string, format: date-time}

    CustomerRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"
          description: Positive INR amount with at most two decimal places.

    CustomerRechargeVerifyRequest:
      type: object
      additionalProperties: false
      required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        razorpay_order_id: {type: string, minLength: 1, maxLength: 100}
        razorpay_payment_id: {type: string, minLength: 1, maxLength: 100}
        razorpay_signature: {type: string, minLength: 1, maxLength: 128}

    CustomerRechargeOrderResponse:
      type: object
      additionalProperties: false
      required: [recharge_order_id, provider, provider_order_id, amount, amount_minor, currency, status, created_at]
      properties:
        recharge_order_id: {type: string, format: uuid}
        provider: {type: string, enum: [RAZORPAY]}
        provider_order_id: {type: string, minLength: 1, maxLength: 100}
        amount: {type: string, pattern: "^[0-9]+\\.[0-9]{2}$"}
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, enum: [INR]}
        provider_key_id: {type: string, maxLength: 100, description: Public Razorpay key ID; present on order creation.}
        status: {type: string, enum: [PAYMENT_PENDING, PAID]}
        created_at: {type: string, format: date-time}

    CustomerFavoritesResponse:
      type: object
      additionalProperties: false
      required: [hubs, chargers, has_more_hubs, has_more_chargers]
      properties:
        hubs:
          type: array
          items:
            $ref: "#/components/schemas/CustomerHubSummary"
        chargers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerCharger"
        next_hub_before: {type: string, format: date-time}
        next_hub_before_id: {type: string, format: uuid}
        has_more_hubs: {type: boolean}
        next_charger_before: {type: string, format: date-time}
        next_charger_before_id: {type: string, format: uuid}
        has_more_chargers: {type: boolean}

    CustomerPriceResponse:
      type: object
      additionalProperties: false
      required: [status, effective_at]
      properties:
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        effective_at: {type: string, format: date-time}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        price_per_unit:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,4})?$"
          description: Exact decimal price for the separately declared price_type and units; present only when available.
        tariff_type:
          type: string
          enum: [fixed]
        price_type:
          type: string
          enum: [sessions, time, energy]
        units:
          type: string
          enum: [minutes, kwh]
          description: Present for energy and time tariffs; omitted for a fixed per-session tariff.
        gst:
          type: object
          additionalProperties: false
          required: [sgst_rate, cgst_rate, igst_rate]
          properties:
            sgst_rate: {type: string}
            cgst_rate: {type: string}
            igst_rate: {type: string}
        unavailable_reason:
          type: string
          enum: [no_eligible_tariff, hub_gst_unavailable, unsupported_tariff_pricing]
          description: Present only when status is UNAVAILABLE.

    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, scope]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        scope:
          type: string
          enum: [PLATFORM]

    CPOLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, scope, cpo_id]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        scope:
          type: string
          enum: [CPO]
        cpo_id:
          type: string
          format: uuid

    ChallengeVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true

    ChallengeResendRequest:
      type: object
      additionalProperties: false
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid

    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at, resend_available_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        resend_available_at:
          type: string
          format: date-time

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code, new_password]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true

    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_token_expires_at
        - refresh_token
        - session_expires_at
        - token_type
        - must_change_password
      properties:
        access_token:
          type: string
          description: Compact signed-then-encrypted JWT.
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Opaque one-time token. Store securely and replace after refresh.
        session_expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          enum: [Bearer]
        cpo_app_id:
          type: string
          description: Present only for CPO scope.
        cpo_app_id_mode:
          $ref: "#/components/schemas/CPOAppIDMode"
        must_change_password:
          type: boolean

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - full_name
        - is_verified
        - mfa_enabled
        - must_change_password
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        is_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, scope]
      properties:
        user:
          $ref: "#/components/schemas/User"
        scope:
          $ref: "#/components/schemas/AuthScope"
        cpo_id:
          type: string
          format: uuid
