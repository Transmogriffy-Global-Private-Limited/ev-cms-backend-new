      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of hubs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs/{hub_id}:
    parameters:
      - $ref: "#/components/parameters/HubID"
    get:
      tags: [CPO Operations]
      operationId: getCPOHub
      summary: Get one tenant hub with a paginated charger list
      description: |
        Returns the hub and its chargers in descending `(created_at, id)` order.
        `before` and `before_id` are an exclusive cursor pair and must be sent
        together when following `chargers.next_before` and
        `chargers.next_before_id`.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: Hub detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubResponse"
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations]
      operationId: updateCPOHub
      summary: Update a tenant hub
      description: Requires CPO ADMIN and at least one mutable field.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHubRequest"
      responses:
        "200":
          description: Updated hub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          description: Invalid body, hub ID, coordinates, fields, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`hub_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs/{hub_id}/chargers:
    parameters:
      - $ref: "#/components/parameters/HubID"
    post:
      tags: [CPO Operations]
      operationId: assignChargerToCPOHub
      summary: Assign or reassign a tenant charger to a hub
      description: |
        Requires CPO ADMIN. Assigns an existing charger of the same CPO to the
        specified hub. A charger may be created without a hub and assigned later.
        Repeating a request for the charger's current hub has no side effect.
        Moving an already assigned charger is atomic and audited. It can return
        `tariff_schedule_conflict` when the relational tariff-scope cascade would
        create an overlapping active tariff schedule.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [charger_id]
              properties:
                charger_id: {type: string, format: uuid}
      responses:
        "200":
          description: Charger successfully assigned or reassigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid body, hub ID, charger ID, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found` or `charger_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`tariff_schedule_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/tariffs:
    post:
      tags: [CPO Operations]
      operationId: createCPOTariff
      summary: Create a tenant tariff
      description: |
        Requires CPO ADMIN. Related hub, optional charger, GST profile,
        and user group must belong to the authenticated CPO; a selected charger
        must belong to the selected hub. Currency defaults to INR. `hub_id` is
        always required. An effective period is either omitted for an open-ended
        tariff or supplied as a half-open `[start_date, end_date)` interval.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTariffRequest"
      responses:
        "201":
          description: Tariff created with a server-generated UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tariff"
        "400":
          description: Invalid body, pricing, currency, relation, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: Referenced tenant resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`tariff_conflict` or `tariff_schedule_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations]
      operationId: listCPOTariffs
      summary: List tenant tariffs
      description: Requires CPO ADMIN and uses stable descending keyset pagination.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of tariffs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

