          in: path
          required: true
          description: UUID of the CPO.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CPO customer intelligence data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOCustomerIntelligenceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: CPO not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/administrative-sessions/revoke:
    post:
      tags: [Superadmin - Platform CPOs]
      operationId: revokeCPOAdministrativeSessions
      summary: Revoke every active CPO-staff session
      description: |
        Revokes only CPO administrative sessions and their unused refresh
