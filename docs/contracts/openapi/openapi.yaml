    put:
      tags: [CPO Operations - Network]
      operationId: updateCPOHubCustomerVisibility
      summary: Publish or unpublish a hub from User App discovery
      description: Requires CPO ADMIN and atomically changes only the hub's `customer_visible` publication gate. Unpublished hubs and their attached chargers are omitted from User App discovery and favorites.
      security:
