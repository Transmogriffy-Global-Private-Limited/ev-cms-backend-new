      responses:
        "200":
          description: Updated CMS administrative status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerStatusResponse"
        "400":
          description: Invalid charger UUID, status, body, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`ocpp_identity_mismatch` — supplied mapping does not match the charger."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers/{charger_id}/image:
    parameters:
      - $ref: "#/components/parameters/ChargerPublicID"
    get:
      tags: [CPO Operations - Network]
      operationId: getCPOChargerImage
      summary: Get the charger's image
      description: Returns the charger's image file. The response is an image file with the appropriate content type.
      security:
