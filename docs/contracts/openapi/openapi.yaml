          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos:
    post:
      tags: [Superadmin - Platform CPOs]
      operationId: createCPO
      summary: Create a pending CPO and its first administrator
      description: |
        Atomically creates a pending CPO with no commercial prerequisite, a
        unique dummy app ID, an ADMIN membership, audit data, and an encrypted
        onboarding mail job. A new email receives a generated temporary
        password; an existing active identity keeps its password. The
        temporary password never appears in the response. The transaction
        fails rather than queueing a new-identity welcome without that
        credential; a successful response proves the job committed, not that
        SMTP has sent it.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCPORequest"
      responses:
        "201":
          description: CPO and first administrator created or attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCPOResponse"
        "400":
          description: |
            `invalid_request`, `invalid_slug`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, `invalid_gstin_state_mismatch`, `invalid_address`,
            `invalid_city`, `invalid_state`, `invalid_pincode`,
            `invalid_admin_email`, or `invalid_admin_full_name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `cpo_slug_conflict`, `cpo_gstin_conflict`,
            `cpo_app_id_conflict`, `admin_identity_conflict`,
            `cpo_admin_membership_conflict`, `cpo_primary_admin_conflict`,
            `admin_identity_inactive`, or the fallback `cpo_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Superadmin - Platform CPOs]
      operationId: listCPOs
      summary: Search and cursor-page CPOs
      description: |
        Returns a stable newest-first page. Search matches business name, slug,
        GSTIN, app ID, and the designated primary administrator's name/email.
        When `has_more` is true, send both returned cursor fields unchanged.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, SUSPENDED]
        - name: app_id_mode
          in: query
          schema:
            $ref: "#/components/schemas/CPOAppIDMode"
        - name: before
          in: query
          description: Exclusive RFC3339 creation-time cursor; requires before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: Exclusive UUID tie-breaker; requires before.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: CPO collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOListResponse"
        "400":
          description: |
            `invalid_q`, `invalid_status`, `invalid_app_id_mode`,
            `invalid_before`, `invalid_before_id`, `invalid_cursor`, or
            `invalid_limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/slug-availability:
    get:
      tags: [Superadmin - Platform CPOs]
      operationId: checkCPOSlugAvailability
      summary: Check whether a normalized CPO slug is currently available
      description: |
        Trims and lowercases the candidate, validates the same format used by
        CPO creation, and reports whether the normalized slug is currently
        unallocated. This read is advisory: concurrent creation can consume an
        available slug, so POST /api/v1/platform/cpos remains authoritative and
        can still return cpo_slug_conflict.
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          description: Candidate CPO slug. The server trims and lowercases it.
          schema:
            type: string
            maxLength: 80
            pattern: "^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$"
      responses:
        "200":
          description: Current availability of the normalized candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOSlugAvailability"
        "400":
          description: "`invalid_slug`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}:
    get:
      tags: [Superadmin - Platform CPOs]
      operationId: getCPO
      summary: Get one CPO
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/operations/fleet:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: getPlatformCPOFleetOperations
      summary: Observe one CPO's CMS-projected fleet state
      description: Platform observation does not grant charger-control authority and never synchronously calls HAL.
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200": {description: Current fleet projection, content: {application/json: {schema: {$ref: "#/components/schemas/FleetOperationsResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/operations/chargers/{charger_id}:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: getPlatformCPOOperationalCharger
      summary: Observe one CPO charger administrative and live projection
      parameters:
        - $ref: "#/components/parameters/CPOID"
        - $ref: "#/components/parameters/ChargerPublicID"
      responses:
        "200": {description: Charger and current live projection, content: {application/json: {schema: {$ref: "#/components/schemas/OperationalChargerResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Charger not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/operations/events:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: listPlatformCPOOperationalEvents
      summary: Recover one CPO's retained operational events
      description: Returns committed HAL-derived CMS projection notifications for one CPO. Events are invalidation hints; the CPO operational REST projections remain authoritative recovery.
      parameters:
        - $ref: "#/components/parameters/CPOID"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: Ordered retained operational events, content: {application/json: {schema: {$ref: "#/components/schemas/OperationalEventPage"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/CPONotFound"}
        "500": {$ref: "#/components/responses/InternalError"}

  /api/v1/platform/cpos/{cpo_id}/operations/realtime/stream:
    get:
      tags: [Superadmin - Platform Operations]
      operationId: streamPlatformCPOOperationalEvents
      summary: Stream one CPO's retained operational events using SSE
      description: Requires a PLATFORM bearer token in the Authorization header. Use fetch streaming, deduplicate numeric event IDs, and recover missed events through the matching REST endpoint.
      parameters:
        - $ref: "#/components/parameters/CPOID"
        - $ref: "#/components/parameters/AfterID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": {description: text/event-stream of OperationalEvent records.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/CPONotFound"}

  /api/v1/platform/cpos/{cpo_id}/profile:
    put:
      tags: [Superadmin - Platform CPOs]
      operationId: updateCPOProfile
      summary: Replace the mutable CPO business profile
      description: |
        Replaces business-profile fields in one transaction and emits audit and
        realtime evidence. The stable slug, lifecycle, app ID, and tenant data
        are not changed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOProfileRequest"
      responses:
        "200":
          description: Updated CPO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_business_name`,
            `invalid_company_type`, `invalid_gstin`, `invalid_gstin_state_mismatch`, `invalid_address`,
            `invalid_city`, `invalid_state`, or `invalid_pincode`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_gstin_conflict` — GSTIN is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/activate:
    post:
      tags: [Superadmin - Platform CPOs]
      operationId: activateCPO
      summary: Set a CPO active
      description: |
        Idempotently grants platform access by setting the CPO lifecycle status
        to ACTIVE. A live app ID is not required. CPO administrative login
        becomes eligible.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current active CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/suspend:
    post:
      tags: [Superadmin - Platform CPOs]
      operationId: suspendCPO
      summary: Suspend a CPO and revoke its sessions
      description: |
        Idempotently sets status to SUSPENDED and revokes every active CPO-staff
        and customer session plus unused refresh tokens for the tenant. New
        tenant login is blocked. Platform sessions are unaffected.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Current suspended CPO record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/app-id:
    put:
      tags: [Superadmin - Platform CPOs]
      operationId: setLiveCPOAppID
      summary: Assign or rotate the live CPO app ID
      description: |
        Normalizes the supplied value to lowercase and replaces the current
        dummy or live ID immediately. Existing sessions stay valid, but tenant
        business requests must use the new header value. The reserved
        `cpo_dummy_` prefix is forbidden.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCPOAppIDRequest"
      responses:
        "200":
          description: CPO with current LIVE app identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPO"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_cpo_app_id`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: "`cpo_app_id_conflict` — app ID is already assigned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin:
    get:
      tags: [Superadmin - Platform CPOs]
      operationId: getCPOPrimaryAdmin
      summary: Get the designated primary administrator
      description: |
        Returns identity/membership state and only safe metadata for the latest
        correlated onboarding mail. Mail ciphertext and delivery errors are not
        exposed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      responses:
        "200":
          description: Current primary administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          $ref: "#/components/responses/InvalidCPOID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Superadmin - Platform CPOs]
      operationId: setCPOPrimaryAdmin
      summary: Restore or replace the primary administrator
      description: |
        Serializes changes per CPO and normalized email. An existing active
        identity keeps its password. A new identity receives a generated
        temporary password only through encrypted onboarding mail, and an
        incomplete welcome payload fails the transaction. Replacing
        the administrator revokes the previous administrator's CPO sessions
        and membership in the same transaction. Repeating the already-active
        assignment is a side-effect-free success.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrimaryAdminRequest"
      responses:
        "200":
          description: Current primary administrator after the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          description: |
            `invalid_request`, `invalid_cpo_id`, `invalid_email`,
            `invalid_full_name`, or `invalid_reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "409":
          description: |
            `admin_identity_inactive`, `admin_identity_conflict`,
            `cpo_admin_membership_conflict`, `cpo_primary_admin_conflict`,
            or the fallback `cpo_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/primary-admin/resend-onboarding:
    post:
      tags: [Superadmin - Platform CPOs]
      operationId: resendCPOPrimaryAdminOnboarding
      summary: Queue a credential-free onboarding recovery email
      description: |
        Queues an encrypted mail containing current CPO/app details and directs
        the active primary administrator to normal password recovery. Existing
        or generated passwords are never sent by this operation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "202":
          description: Mail queued; response contains the resulting safe metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryAdmin"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`primary_admin_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/platform/cpos/{cpo_id}/customer-intelligence:
    get:
      tags: [Superadmin - Platform CPOs]
      operationId: getCPOCustomerIntelligence
      summary: Get CPO customer intelligence dashboard data
      description: |
        Returns aggregated customer metrics and top customers for a given CPO.
        Requires platform superadmin authority.
      security:
        - BearerAuth: []
      parameters:
