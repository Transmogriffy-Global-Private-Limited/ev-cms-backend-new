        "404":
          description: "`cpo_not_found` or `primary_admin_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`primary_admin_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/MailUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/platform/cpos/{cpo_id}/administrative-sessions/revoke:
    post:
      tags: [Platform CPOs]
      operationId: revokeCPOAdministrativeSessions
      summary: Revoke every active CPO-staff session
      description: |
        Revokes only CPO administrative sessions and their unused refresh
        tokens. Customer sessions, platform sessions, memberships, CPO
        lifecycle, and tenant data are unchanged. Repeating the command is safe
        and returns zero counts when no active sessions remain.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CPOID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Revocation counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResponse"
        "400":
          description: "`invalid_request`, `invalid_cpo_id`, or `invalid_reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/organization:
    get:
      tags: [CPO Operations]
      operationId: getCPOOrganization
      summary: Read the authenticated CPO's organization details
      description: |
        Returns a tenant-safe, read-only projection of the CPO registration
        and operational identity managed by the platform. The CPO ID is
        derived from the verified ADMIN session; callers cannot select another
        tenant. Internal platform actor IDs and the privileged lifecycle reason
        are omitted. Organization changes remain Superadmin-only.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current CPO organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOOrganization"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          $ref: "#/components/responses/CPONotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/admin/profile:
    get:
      tags: [CPO Operations]
      operationId: getCPOAdminProfile
      summary: Read the authenticated CPO administrator profile
      description: |
        Returns the global login identity fields used by the current CPO ADMIN
        session, including optional phone. `/api/v1/auth/me` remains the
        canonical authentication/bootstrap response. This route does not return
        or edit the CPO organization record.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current administrator identity profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          $ref: "#/components/responses/MissingCPOAppID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations]
      operationId: updateCPOAdminProfile
      summary: Update the authenticated administrator name or phone
      description: |
        Updates the global identity used by this ADMIN session and writes
        `CPO_ADMIN_PROFILE_UPDATED` audit evidence. Email and role are
        immutable here. A blank phone clears it; blank full name is invalid.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCPOAdminProfileRequest"
      responses:
        "200":
          description: Updated administrator profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPOAdminProfile"
        "400":
          description: Invalid body, profile field, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers:
    post:
      tags: [CPO Operations]
      operationId: createCPOCharger
      summary: Register a CMS charger and its initial connectors
      description: |
        Requires the currently supported CPO ADMIN authority. The server generates the six
        character public `charger_id`, CMS UUIDs, and a globally unique
        `ocpp_identity`; callers do not source these identifiers. The charger,
        connectors, and audit record commit atomically. This is commercial CMS
        inventory only and does not create an OCPP connection in the HAL.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargerRequest"
      responses:
        "201":
          description: Charger and connectors created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid body, field, hub, connector, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found` — the tenant does not own the hub."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_conflict` or `connector_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations]
      operationId: listCPOChargers
      summary: List tenant chargers with connectors
      description: |
        Requires the currently supported CPO ADMIN authority. Results use stable descending
        `(created_at, id)` keyset pagination and never cross the authenticated
        CPO boundary.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of chargers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/chargers/{charger_id}:
    parameters:
      - $ref: "#/components/parameters/ChargerPublicID"
    get:
      tags: [CPO Operations]
      operationId: getCPOCharger
      summary: Get one tenant charger and its connectors
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Charger detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations]
      operationId: updateCPOCharger
      summary: Update a charger and selected existing connectors
      description: |
        Requires CPO ADMIN. Connector updates identify existing
        connectors by server-generated UUID and cannot add or remove
        connectors. Public charger ID, OCPP identity, OCPP version, charger and
        connector status, and last-seen time are read-only CMS projection fields.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChargerRequest"
      responses:
        "200":
          description: Updated charger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charger"
        "400":
          description: Invalid body, field, connector, charger ID, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`, `connector_not_found`, or `hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Charger or connector uniqueness/reference conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Operations]
      operationId: deleteCPOCharger
      summary: Delete an unused charger and its connectors
      description: |
        Requires CPO ADMIN. The charger and connectors are
        deleted transactionally and the action is audited. PostgreSQL rejects
        deletion while tariffs, charging sessions, access links, favourites,
        or other dependent records still reference the charger.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Charger deleted; no response body.
        "400":
          description: Invalid charger ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`charger_in_use` — dependent durable records prevent deletion."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

