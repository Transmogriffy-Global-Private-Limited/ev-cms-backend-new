    parameters:
      - $ref: "#/components/parameters/ChargerInternalID"
    get:
      tags: [CPO Operations - Network]
      operationId: getCPOChargerStatus
      summary: Get a tenant charger's CMS administrative status
      description: Uses the charger's internal UUID, not its public six-character `charger_id`. This is static CMS administrative state, not HAL-backed live availability.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "200":
          description: Current CMS administrative status for this CPO charger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerStatusResponse"
        "400":
          description: Invalid charger UUID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — no charger in this CPO has the UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [CPO Operations - Network]
      operationId: updateCPOChargerStatus
      summary: Update a tenant charger's CMS administrative status
      description: Uses the charger's internal UUID. An optional OCPP identity must match the stored mapping when supplied. This does not contact HAL or report live charger availability.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
