          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`settings_not_found` — no settings for this CPO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [CPO Operations - Account & Notifications]
      operationId: createOrUpdateCpoSettings
      summary: Create or update the CPO's settings
      description: |
        Creates or updates the settings for the authenticated CPO.
