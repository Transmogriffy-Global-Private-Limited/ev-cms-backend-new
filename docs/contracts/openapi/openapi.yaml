          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` or `image_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs:
    post:
      tags: [CPO Operations - Network]
      operationId: createCPOHub
      summary: Create a tenant charging hub
      description: |
        Requires CPO ADMIN and writes audit evidence atomically. The Hub is
        always created hidden: customer_visible=true is rejected because an
        enabled unbounded Hub-root tariff can exist only after this Hub exists.
        Create the root tariff, then publish through the Hub update route.
        Optionally assigns existing tenant chargers, which must not already
        belong to a hub.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHubRequest"
      responses:
        "201":
          description: Hub created with a server-generated UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          description: Invalid body, coordinates, fields, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`charger_not_found` — a requested charger was not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`hub_conflict`, `charger_already_in_hub`, or `hub_tariff_root_required` when customer_visible=true is requested during creation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [CPO Operations - Network]
      operationId: listCPOHubs
      summary: List tenant hubs
      description: Requires CPO ADMIN and uses stable descending keyset pagination.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One bounded page of hubs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubListResponse"
        "400":
          description: Invalid cursor, limit, or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs/{hub_id}:
    parameters:
      - $ref: "#/components/parameters/HubID"
    get:
      tags: [CPO Operations - Network]
      operationId: getCPOHub
      summary: Get one tenant hub with a paginated charger list
      description: |
        Returns the hub and its chargers in descending `(created_at, id)` order.
        `before` and `before_id` are an exclusive cursor pair and must be sent
        together when following `chargers.next_before` and
        `chargers.next_before_id`.
      security:
        - BearerAuth: []
          CPOAppID: []
      parameters:
        - $ref: "#/components/parameters/ListBefore"
        - $ref: "#/components/parameters/ListBeforeID"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: Hub detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubResponse"
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [CPO Operations - Network]
      operationId: updateCPOHub
      summary: Update a tenant hub
      description: Requires CPO ADMIN and at least one mutable field.
      security:
        - BearerAuth: []
          CPOAppID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHubRequest"
      responses:
        "200":
          description: Updated hub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hub"
        "400":
          description: Invalid body, hub ID, coordinates, fields, or app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`hub_conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [CPO Operations - Network]
      operationId: deleteCPOHub
      summary: Delete a hub
      description: Deletes a hub and disassociates all chargers from it. The chargers themselves are not deleted. The hub cannot be deleted if it has any tariffs associated with it.
      security:
        - BearerAuth: []
          CPOAppID: []
      responses:
        "204":
          description: Hub deleted successfully.
        "400":
          description: Invalid hub ID or missing app-ID header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CPOBusinessForbidden"
        "404":
          description: "`hub_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`hub_has_tariffs`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/cpo/hubs/{hub_id}/customer-visibility:
    parameters:
