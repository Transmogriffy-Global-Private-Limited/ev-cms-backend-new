    CreateTariffRequest:
      type: object
      additionalProperties: false
      required: [price_per_unit, tariff_type, price_type]
      description: Commercial fields only. The nested route determines the one immutable tariff target; GST is configured on the hub, never on a tariff. Supported combinations are fixed energy/kWh, fixed time/minutes, and fixed sessions with units omitted. Non-zero idle fees are unsupported until an authoritative idle interval exists.
      properties:
        price_per_unit:
          $ref: "#/components/schemas/DecimalInput"
        idle_fee_per_min:
          $ref: "#/components/schemas/DecimalInput"
          description: Must be zero for an active tariff. Retained for durable snapshots and inactive legacy records; it is never billed.
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
          default: INR
        is_active: {type: boolean, default: true}
        start_date:
          type: string
          format: date-time
          description: Omit with end_date for an unbounded root, or provide without end_date for an open-ended fallback. With end_date, it is the inclusive beginning of a bounded override.
        end_date:
          type: string
          format: date-time
          description: Optional exclusive end of a bounded override. It requires start_date and must be later than it.
        tariff_type:
          type: string
          enum: [fixed]
          description: Required tariff charging model; currently fixed.
        price_type:
          type: string
          enum: [sessions, time, energy]
          description: Required billable basis.
        units:
          type: string
          enum: [minutes, kwh]
          description: Required as kwh for energy and minutes for time; omit for sessions.
      example:
        price_per_unit: "16.9100"
        idle_fee_per_min: "0.0000"
        currency: INR
        is_active: true
        tariff_type: fixed
        price_type: energy
        units: kwh

    UpdateTariffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Updates commercial fields only. A tariff's target remains the nested route target for its lifetime. Omitted fields remain unchanged. For units, start_date, and end_date, explicit null clears the stored value. The resulting tariff must use a supported fixed price_type/units combination and a root, open-ended fallback, or complete bounded schedule; enabled rows must form the target's valid temporal hierarchy.
      properties:
        price_per_unit: {$ref: "#/components/schemas/DecimalInput"}
        idle_fee_per_min:
          allOf: [{$ref: "#/components/schemas/DecimalInput"}]
          description: The resulting active tariff must retain a zero idle fee because idle billing is not supported.
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
        is_active: {type: boolean}
        start_date:
          type: string
          format: date-time
          nullable: true
          description: Omit to retain the current value; send null with end_date null to make an unbounded root. A supplied value with no end_date is an open-ended fallback; with end_date it begins a bounded override.
        end_date:
          type: string
          format: date-time
          nullable: true
          description: Omit to retain the current value; send null with start_date null to make an unbounded root. A supplied value requires start_date and is the exclusive end of a bounded override.
        tariff_type:
          type: string
          enum: [fixed]
        price_type:
          type: string
          enum: [sessions, time, energy]
        units:
          type: string
          enum: [minutes, kwh]
          nullable: true
          description: Omit to retain the current value. Send null when changing to sessions; otherwise energy requires kwh and time requires minutes.

