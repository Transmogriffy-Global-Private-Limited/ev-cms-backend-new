              "\n    LiveChargingSessionView:\n",
              "required: [session_id, status, started_at, duration_seconds, customer_name, charger_id, charger_name, connector_id, connector_number, meter_freshness, soc_freshness]",
              "required: [session_id, status, started_at, duration_seconds, customer_name, charger_id, charger_name, connector_id, connector_number, meter_freshness, soc_freshness, projected_amount, currency]",
          )
          replace_first_after(
              openapi,
              "\n    LiveChargingSessionView:\n",
              '''        consumed_wh: {type: integer, format: int64, minimum: 0}
        meter_observed_at: {type: string, format: date-time}''',
              '''        consumed_wh: {type: integer, format: int64, minimum: 0}
        projected_amount: {$ref: "#/components/schemas/ExactDecimal", description: "Current accrued charge projected from the session's immutable tariff/tax snapshots; this is not final settlement."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        meter_observed_at: {type: string, format: date-time}''',
          )
          replace_first_after(
              openapi,
              "\n    ChargingSessionView:\n",
              '''        total_amount: {type: string, pattern: "^[0-9]+(?:\\\\.[0-9]{1,2})?$", description: Present only after a completed session has final persisted settlement.}
        currency: {type: string, pattern: "^[A-Z]{3}$"}''',
              '''        total_amount: {type: string, pattern: "^[0-9]+(?:\\\\.[0-9]{1,2})?$", description: Present only after a completed session has final persisted settlement.}
        projected_amount: {type: string, pattern: "^[0-9]+(?:\\\\.[0-9]{1,2})?$", description: "Present while final settlement is not yet persisted; current accrued charge from immutable tariff/tax snapshots, not a settled amount."}
        currency: {type: string, pattern: "^[A-Z]{3}$"}''',
          )

          # The workflow is only an isolated transport for this branch-local change.
          Path(".github/workflows/gpt-web-work-implement.yml").unlink()
