name: GPT Web Work Isolated Implementation

on:
  push:
    branches:
      - gpt-web-work
    paths:
      - .github/workflows/gpt-web-work-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: gpt-web-work
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply bounded source changes
        run: |
          python3 scripts/gpt_web_work_fix.py
          python3 scripts/gpt_web_work_structural_fix.py
          python3 scripts/gpt_web_work_apply.py
          python3 scripts/gpt_web_work_openapi_post.py

      - name: Format changed Go source
        run: |
          gofmt -w \
            src/commercial/session_amount.go \
            src/commercial/session_amount_test.go \
            src/cpo/live_financial_projection.go \
            src/cpo/live_financial_projection_test.go \
            src/cpo/customer_usage_projection.go \
            src/customerauth/live_financial_projection.go \
            src/customerauth/live_financial_projection_test.go \
            src/customerauth/charging_facts.go

      - name: Focused tests
        run: go test -count=1 ./src/commercial ./src/cpo ./src/customerauth

      - name: Full tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: OpenAPI runtime contract
        run: go test ./src/routes -run TestOpenAPIContractMatchesRuntimeRoutesAndServesUI -count=1

      - name: Documentation verification
        shell: pwsh
        run: ./scripts/verify-docs.ps1

      - name: Diff check
        run: git diff --check

      - name: Commit and push only gpt-web-work
        run: |
          test "${GITHUB_REF}" = "refs/heads/gpt-web-work"
          git config user.name "GPT Web Work"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: project live charging money and current usage"
          git push origin HEAD:gpt-web-work
